<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
/* Font salvati nel progetto, così funzionano anche offline */
@font-face{font-family:"Bricolage Grotesque";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:italic;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-italic.woff2) format("woff2")}

/* Colore principale: blu profondo. Verde, giallo e rosso sono riservati al semaforo e agli avvisi. */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#141B2B; --muted:#5A6479; --line:#D9DFEA;
  --accent:#2347A6; --accent-ink:#FFFFFF; --accent-soft:#DFE7F8;
  --ok:#1C7C4A; --ok-soft:#D8F0E2; --warn:#A06400; --warn-soft:#FBEBCF; --urgent:#B93A29; --urgent-soft:#F8DDD8;
  --shadow:0 1px 2px rgba(20,27,43,.05),0 6px 18px rgba(20,27,43,.06);
  --backdrop:rgba(14,19,29,.45);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-s:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E131D; --surface:#171E2B; --surface-2:#1D2535; --ink:#E6EBF4; --muted:#97A2B8; --line:#2A3446;
  --accent:#86A6F4; --accent-ink:#0A1530; --accent-soft:#1C2A4A;
  --ok:#5CCB8E; --ok-soft:#173527; --warn:#F0AB45; --warn-soft:#3A2B12; --urgent:#F07D6D; --urgent-soft:#3F201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}

/* navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.brand{display:none}
@media (min-width:900px){
  .app{max-width:860px;padding-bottom:48px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px;margin-bottom:6px}
  .brand{display:block;font-family:var(--f-display);font-weight:800;font-size:20px}
  .nav{position:static;border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
  .nav button{flex-direction:row;gap:7px;padding:8px 14px;font-size:15px;max-width:none}
  .nav button svg{width:19px;height:19px}
}

.banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--warn-soft);border-radius:var(--r-s);padding:10px 12px 10px 14px;margin-bottom:12px;font-size:15px}
.banner button{flex:none;font-weight:700;color:var(--warn);padding:2px 4px}

/* pagina Prove (v27): com'è fatto un esame e quando sono le prove */
.pv-hero{border-left:6px solid var(--accent);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start}
.pv-hero>*{grid-column:1}
.pv-hero .eyebrow{color:var(--accent)}
.pv-count{grid-column:2;grid-row:1/span 5;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:10px 12px;min-width:78px}
.pv-count b{display:block;font-family:var(--f-display);font-size:34px;line-height:1.05}
.pv-count span{font-size:13px;font-weight:700}
.pv-big{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.2}
.pv-when{font-size:17px}
.pv-parts{display:grid;gap:10px}
@media (min-width:600px){.pv-parts{grid-template-columns:1fr 1fr}}
.pv-part{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);min-width:0}
.pv-ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:17px}
.pv-nums{display:flex;gap:18px;flex-wrap:wrap}
.pv-nums span{color:var(--muted);font-size:14px;font-weight:700}
.pv-nums b{font-family:var(--f-display);font-size:28px;color:var(--ink);margin-right:4px}
.pv-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;font-size:15px;line-height:1.4}
.pv-dl dt{color:var(--muted);font-weight:700;font-size:13.5px;padding-top:1px}
.pv-dl dd{margin:0}
.pv-p{margin:0;font-size:15px}
.tl{display:flex;flex-direction:column}
.tl-m{font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 0 4px;border-top:1px solid var(--line)}
.tl>.tl-m:first-child{border-top:0;padding-top:2px}
.tl-it{display:flex;gap:12px;padding:8px 0 12px}
.tl-d{flex:none;width:62px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;padding:7px 4px;line-height:1.1;align-self:flex-start}
.tl-d b{font-family:var(--f-display);font-size:25px}
.tl-d.per b{font-size:17px;padding:4px 0 2px}
.tl-d span{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tl-d small{font-size:12px;color:var(--muted)}
.tl-it.next .tl-d{background:var(--accent);color:var(--accent-ink)}
.tl-it.next .tl-d span,.tl-it.next .tl-d small{color:var(--accent-ink)}
.tl-it.past{opacity:.6}
.tl-b{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.tl-t{font-weight:800;font-size:17px;line-height:1.25}
.tl-w{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.tl-nota{background:var(--surface-2);border-radius:8px;padding:5px 9px}
.tl-nota.warn{background:var(--warn-soft)}
.pv-calc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;font-weight:700}
.pv-step{display:flex;align-items:center;gap:8px}
.pv-step b{font-family:var(--f-display);font-size:30px;min-width:1.5em;text-align:center}
.pv-step .btn{min-width:48px;font-size:22px}
.pv-qs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pv-q{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.pv-q.on{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.pv-q.lode{border-style:dashed}
.pv-msg{margin:0;padding:10px 12px;border-radius:10px;font-weight:600}
.pv-msg.good{background:var(--ok-soft)}.pv-msg.bad{background:var(--urgent-soft)}
.pv-ses{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.pv-se{border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.pv-se>span{color:var(--muted);font-size:14.5px}
.pv-se .chips{gap:4px}
.pv-se .chip{white-space:normal}
.pv-se.mine{border-color:var(--accent);border-width:2px}
.pv-se.past{opacity:.55}
.pv-det{border-top:1px solid var(--line)}
.pv-det:first-of-type{border-top:0}
.pv-det summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0}
.pv-det summary::-webkit-details-marker{display:none}
.pv-det summary::before{content:"";flex:none;width:9px;height:9px;margin:0 5px 0 3px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg);transition:transform .15s}
.pv-det[open] summary::before{transform:rotate(45deg)}
.pv-det summary>.muted{margin-left:auto;text-align:right}
.pv-st{display:flex;flex-direction:column;line-height:1.3}
.pv-det>:not(summary){margin-left:24px}
.pv-det[open]{padding-bottom:10px}
.pv-ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:15px}
.pv-dv{border-left:6px solid var(--warn)}
.pv-dv .eyebrow{color:var(--warn)}
/* simulazione d'esame (v28) */
.sim-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);padding:10px 2px;border-bottom:1px solid var(--line)}
.sim-bar .t{font-size:17px}
.sim-clock{font-family:var(--f-display);font-size:24px;font-weight:800;padding:2px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);min-width:84px;text-align:center}
.sim-clock.warn{background:var(--warn-soft);color:var(--warn)}
.sim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.sim-n{height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sim-n.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.sim-n.cur{border:2.5px solid var(--accent);color:var(--ink)}
.qz-op.sel{border-color:var(--accent);background:var(--accent-soft)}
.qz-op.sel .qz-l{background:var(--accent);color:var(--accent-ink)}
.sim-nav{display:flex;gap:10px}
.sim-nav .btn{flex:1}
.sim-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sim-cf{border-left:6px solid var(--warn)}
.sim-btn{margin-top:6px}
/* al PC la simulazione non si allarga a tutto lo schermo: le righe lunghe si leggono male */
.sim-page{width:100%;max-width:760px;margin:0 auto}
@media (min-width:900px){.sim-bar{top:calc(env(safe-area-inset-top,0px) + var(--topbar-h,70px))}}
/* segno di lettura (v29): la riga dove sei arrivato, con il fondo giallo e una linea sotto */
#segno{position:absolute;z-index:4;pointer-events:none;border-radius:6px;background:rgba(255,196,0,.28);box-shadow:inset 0 -3px 0 var(--warn)}
@media (prefers-color-scheme: dark){#segno{background:rgba(255,196,60,.17)}}
#segno-ctl{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:4px 4px 4px 12px}
#segno-ctl span{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
#segno-ctl button{width:42px;height:42px;border-radius:10px;font-size:18px;font-weight:800;background:var(--surface-2);color:var(--ink)}
@media (min-width:900px){#segno-ctl{bottom:24px}}
.seg-hint{margin:-4px 0 0}
.sim-score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sim-score b{font-family:var(--f-display);font-size:44px;line-height:1}
.sim-score span{font-size:18px;color:var(--muted);font-weight:700}
.sim-rq .btnrow{margin-top:10px}
@media (prefers-reduced-motion:reduce){.pv-det summary::before{transition:none}}

/* card e testi */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.page-h{font-size:30px;font-weight:800;line-height:1.1}
.sec-h{font-size:20px;font-weight:800;margin:6px 0 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--urgent-soft);color:var(--urgent)}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface-2);color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:58px;font-size:18px;border-radius:14px}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.armed{background:var(--urgent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.btnrow .btn.ghost{flex:0 0 auto}
.more-btn{width:100%;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;min-height:40px;padding-right:8px}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* adesso */
.now{border-left:6px solid var(--accent)}
.upd{border-left:6px solid var(--ok)}
.upd .eyebrow{color:var(--ok)}
.now .what{font-family:var(--f-display);font-size:clamp(23px,6vw,30px);font-weight:800;line-height:1.15;margin:4px 0 6px;overflow-wrap:anywhere}
.deadline{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border-left:6px solid var(--warn)}
.deadline .eyebrow{color:var(--warn)}
.dl-what{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.dl-book{font-size:14px;font-weight:600}
.dl-book.open{color:var(--ok)}.dl-book.wait{color:var(--muted)}.dl-book.closed{color:var(--urgent)}
.cal-p{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.cal .eyebrow+.cal-p{border-top:0;padding-top:0}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cal-d{font-size:16px}
.cal-req{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.req{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;padding:6px 4px;border-radius:10px}
.req:disabled{cursor:default;opacity:1}
.req .req-t{flex:1;min-width:0;overflow-wrap:anywhere}
.box-c{width:24px;height:24px;flex:none;border:2px solid var(--muted);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink)}
.req.ok .box-c{background:var(--ok);border-color:var(--ok)}
.req.ok .req-t{color:var(--muted);text-decoration:line-through}
/* piano di studio (v16) */
.pl-list{display:flex;flex-direction:column}
.pl-it{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:52px}
.pl-it:first-child{border-top:0}
.pl-chk{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;margin-left:-8px}
.pl-it.ok .box-c{background:var(--ok);border-color:var(--ok)}
.pl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left;padding:6px 0;border-radius:8px}
button.pl-t .t{color:var(--accent)}
.pl-t .t{font-weight:700;overflow-wrap:anywhere}
.pl-t .m{font-size:13.5px;color:var(--muted)}
.pl-it.ok .t{color:var(--muted);text-decoration:line-through}
.day-h,.sem-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sem{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.eyebrow+.sem{border-top:0;padding-top:2px}
.done-card{border-left-color:var(--ok)}
.done-card .eyebrow{color:var(--ok)}
.sub-h{font-size:20px;font-weight:800;margin:6px 0 -4px}
.examrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.examrow:first-child{border-top:0;padding-top:0}
.examrow{flex-wrap:wrap}
.examrow b{overflow-wrap:break-word;min-width:0}

/* righe toccabili */
.cap-h{display:flex;flex-direction:column;gap:2px;font-size:17px;font-weight:800;line-height:1.25;margin:14px 2px 2px;overflow-wrap:anywhere}
.stack-s>.cap-h:first-child{margin-top:4px}
.cap-h .small{font-weight:400;font-family:var(--f-body)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;min-height:60px}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row svg.go{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;flex:none}
.row.off{opacity:.6;cursor:default;box-shadow:none;background:var(--surface-2)}
.row .n{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-weight:800;font-family:var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px}

/* visualizzatore */
.nextstep{background:var(--accent-soft);border-radius:14px;padding:12px 14px}
.nextstep .eyebrow{color:var(--accent)}
.incerto{background:var(--warn-soft);border-radius:14px;padding:12px 14px}
.incerto .eyebrow{color:var(--warn)}
.acc{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:60px}
.acc-h .txt{flex:1;min-width:0}
.acc-h .t{font-weight:700;overflow-wrap:anywhere;display:block}
.acc-h .chev{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.4;flex:none;transition:transform .2s}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-b{padding:0 16px 16px}
.dot{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center}
.dot svg{width:15px;height:15px;stroke:var(--accent-ink);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.on svg{opacity:1}
.readbtn.on{background:var(--accent-soft);color:var(--accent)}
/* esercizi con le caselle (v17) */
.ans{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ans-row{display:flex;flex-direction:column;gap:4px}
.ans-l{font-weight:700;font-size:14.5px}
.ans-line{display:flex;gap:8px;align-items:center}
.ans-in{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-width:420px}
.ans-in.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans-in.bad{border-color:var(--urgent)}
.ans-mark{font-weight:800;font-size:20px;flex:none}
.ans-mark.ok{color:var(--ok)}.ans-mark.bad{color:var(--urgent)}
.ans-msg{font-size:14.5px;color:var(--urgent);background:var(--urgent-soft);border-radius:10px;padding:6px 10px}
.ans-ok{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 14px;font-weight:700}
.ans-no{font-size:14.5px;color:var(--muted)}
.box{background:var(--surface-2);border-radius:12px;padding:10px 14px;margin-top:10px}
/* quiz (v20) */
.qz-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.qz-ops{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qz-op{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.qz-op:disabled{cursor:default;opacity:1}
.qz-op .qz-l{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:var(--surface-2);color:var(--muted)}
.qz-op .qz-t{flex:1;min-width:0}.qz-op .qz-t p{margin:0}
.qz-op.ok{border-color:var(--ok);background:var(--ok-soft)}.qz-op.ok .qz-l{background:var(--ok);color:var(--accent-ink)}
.qz-op.bad{border-color:var(--urgent);background:var(--urgent-soft)}.qz-op.bad .qz-l{background:var(--urgent);color:var(--accent-ink)}
.qz-op.off{opacity:.65}
.qz-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.sp-in{min-height:84px;font-size:15.5px}
.box .eyebrow{display:block;margin-bottom:2px}
.box.sol{background:var(--ok-soft)}
.box.sol .eyebrow{color:var(--ok)}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps li{display:flex;gap:10px;background:var(--surface-2);border-radius:12px;padding:10px 12px;counter-increment:st;animation:up .2s ease}
.steps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.steps li>div{min-width:0;flex:1}
/* «Mettiti alla prova»: esercizi dentro la sezione, subito dopo la teoria che serve */
.tryit{margin-top:14px;padding:12px;border-radius:14px;background:var(--ok-soft)}
.tryit>.eyebrow{color:var(--ok);margin-bottom:8px}
.tryit .card.ex{box-shadow:none}
.toc .tx{font-weight:400;color:var(--muted);font-size:12.5px}
/* sul telefono il riquadro dentro il riquadro ruba spazio al codice: margini più stretti */
@media (max-width:420px){.tryit{padding:8px;margin-left:-8px;margin-right:-8px}.tryit .card.ex{padding:12px 10px}}

/* testo di studio (Markdown) */
.md{overflow-wrap:break-word;min-width:0}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .7em}
.md ul,.md ol{margin:0 0 .7em;padding-left:1.3em}
.md li{margin:.15em 0}
.md .mh{font-family:var(--f-display);font-weight:800;font-size:18px;margin:1em 0 .4em}
.md .mathblock{display:block;overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.3em 0;-webkit-overflow-scrolling:touch}
.md .katex{font-size:1.08em}
.md .katex-error{color:var(--urgent)}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 .3em;overflow-wrap:anywhere}
.md pre.codeblock{margin:.3em 0 .8em;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;line-height:1.45;tab-size:4}
.md pre.codeblock code{display:block;width:max-content;min-width:100%;background:none;border:0;padding:0;font-size:clamp(11.5px,3vw,13.5px);white-space:pre;overflow-wrap:normal}
/* sul telefono (375 px) il codice scende a 11,5 px e il riquadro ha margini più stretti:
   così righe di C fino a 46 caratteri stanno nello schermo senza scorrere di lato */
@media (max-width:420px){.md pre.codeblock{padding:10px 9px}}
/* disegni (```text): righe più vicine, così le linee verticali │ dei riquadri si toccano e non sembrano tratteggiate */
.md pre.codeblock.diagram{line-height:1.2}
/* tabelle (v24): righe separate da linee sottili, intestazione colorata; se è larga scorre di lato nel suo riquadro */
.tbl-wrap{margin:.4em 0 .9em;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:.94em;line-height:1.4}
.tbl th,.tbl td{padding:8px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line);min-width:6.5em}
.tbl th{background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.86em;letter-spacing:.02em;border-top:0;white-space:nowrap}
.tbl td:first-child{font-weight:700}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.tbl .tr{text-align:right;font-variant-numeric:tabular-nums}
.tbl .tc{text-align:center}
.tbl code{white-space:nowrap}
@media (max-width:420px){.tbl th,.tbl td{padding:7px 9px;min-width:5.5em}}
@media (max-width:560px){
  .tbl-txt .tbl thead{display:none}
  .tbl-txt .tbl tr{display:block;border-top:1px solid var(--line);padding:6px 0}
  .tbl-txt .tbl tbody tr:first-child{border-top:0}
  .tbl-txt .tbl td{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;border:0;padding:3px 12px;min-width:0;background:none!important;text-align:left}
  .tbl-txt .tbl td::before{content:attr(data-h);font-size:.8em;font-weight:800;color:var(--accent);padding-top:.15em}
  .tbl-txt .tbl td:first-child{font-size:1.02em}
}

/* vittorie e dati */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13.5px;color:var(--muted)}
.win{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.win:first-child{border-top:0}
.win .d{flex:none;width:58px;font-weight:700;color:var(--accent);font-size:14px}
.win .w{min-width:0;overflow-wrap:anywhere}
.empty{padding:16px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.note{font-size:14px;color:var(--muted)}

/* import */
textarea,.field{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
textarea:focus,.field:focus{outline:none;border-color:var(--accent)}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:180px;resize:vertical}
.msg{border-radius:12px;padding:12px 14px}
.msg.err{background:var(--urgent-soft)}
.msg.err .eyebrow{color:var(--urgent)}
.msg.okk{background:var(--ok-soft)}
.msg.okk .eyebrow{color:var(--ok)}
.msg.wrn{background:var(--warn-soft)}
.msg.wrn .eyebrow{color:var(--warn)}
.msg ul{margin:6px 0 0;padding-left:1.2em}
.msg li{margin:4px 0;overflow-wrap:anywhere}
.msg pre{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--surface);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.lbl{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field[type=date]{min-height:48px;-webkit-appearance:none;appearance:none}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px}
.check input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.batch li{display:flex;gap:8px;align-items:baseline;list-style:none}
.batch ul{padding-left:0}
.batch .ico{flex:none;font-weight:800}

/* esami: totale ore e ordine */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.card.tot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card.tot b{font-family:var(--f-display);font-size:24px;font-weight:800}
.sortbtns{display:flex;gap:6px;flex:none}
.sortbtns .btn{min-width:44px;padding:0;font-size:18px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;font-weight:700;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* pannello che sale dal basso */
.backdrop{position:fixed;inset:0;z-index:40;background:var(--backdrop);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:22px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:12px}
.sheet .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sheet .foot .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* collegamenti interni, riquadro di ripasso, glossario, «Prima di iniziare», mappa */
.xref{display:inline;font-weight:650;color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:3px;text-align:left}
.xref:hover{text-decoration-style:solid}
.xref.miss{color:var(--muted)}
.prereq{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:6px solid var(--accent)}
.prereq .eyebrow{color:var(--accent)}
.prereq ul{margin:6px 0 8px;padding-left:1.1em}
.prereq li{margin:7px 0}
.prereq .why{color:var(--muted);font-size:15px}
.prereq .why .md p{margin:2px 0 0}
.mappa .acc-h .t{font-weight:600}
.sheet .refbody{margin-bottom:12px}
.sheet .refbody .box:first-child{margin-top:0}
.en{font-weight:500;font-size:.78em}
.box.bad{background:var(--urgent-soft)}
.box.bad .eyebrow{color:var(--urgent)}
.gl[hidden]{display:none}
/* strumenti interattivi */
.tool{margin:14px 0 18px;border:2px solid var(--accent-soft);border-radius:16px;padding:12px;background:var(--surface);font-size:16px}
.tool-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.tool-h .eyebrow{color:var(--accent)}
.tool-h b{font-size:1.08em}
.tool-help{display:grid;gap:8px;margin-bottom:10px;font-size:15px}
.tool-help>div{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.tool-help .md p{margin:2px 0}
.tool-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tool-ctrl .btn{min-height:42px;padding:0 14px}
.tool-ctrl .btn:disabled{opacity:.45;cursor:default}
.tic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tic.f{fill:currentColor;stroke:none}
.tool-ctrl .btn{gap:6px}
.tool-ctrl .num{font-weight:800;color:var(--muted);margin:0 4px;font-variant-numeric:tabular-nums}
.tool-nota{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:10px;min-height:3.2em}
.tool-nota .md p{margin:2px 0}
.tool-cols{display:grid;gap:12px}
.tool-col{min-width:0;display:flex;flex-direction:column;gap:8px}
.tool-colh{font-weight:800;color:var(--accent);text-transform:uppercase;font-size:13px;letter-spacing:.06em;border-bottom:2px solid var(--accent-soft);padding-bottom:3px}
.tool-cnote{font-size:15px;color:var(--muted)}
.tool-cnote .md p{margin:0}
.tool-panel .eyebrow{display:block;margin-bottom:3px}
.tool-pre{margin:0;padding:6px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5}
.tool-pre .ln{display:block;white-space:pre;padding:0 10px;border-left:4px solid transparent;min-width:max-content;transition:background .25s}
.tool-pre .ln.chg{background:var(--ok-soft)}
.tool-pre .ln.cur{background:var(--accent-soft);border-left-color:var(--accent);font-weight:700}
.tool-sch-wrap{display:grid;gap:12px}
.tool-schema{display:flex;flex-direction:column}
.tool-node{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);font-weight:700;min-height:46px}
.tool-node small{font-weight:500;color:var(--muted);font-size:13.5px}
.tool-node.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tool-tra{text-align:center;color:var(--muted);font-size:13px;padding:2px 6px;line-height:1.3}
.tool-detail{background:var(--surface-2);border-radius:12px;padding:10px 14px;min-height:80px;min-width:0}
.tool-detail>.eyebrow{display:block;margin-bottom:2px;color:var(--accent)}
.tool-opts{display:grid;gap:8px;margin:8px 0}
.tool-opt{text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;min-height:46px;overflow-wrap:anywhere}
.tool-opt code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
.tool-opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.tool-opt.no{border-color:var(--urgent);background:var(--urgent-soft)}
.tool-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tool-opt.tried{opacity:.55}
.tool-opt:disabled{cursor:default}
.tool-match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.tool-match>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.tool-ok{color:var(--ok);font-weight:700}
.tool-no{color:var(--urgent);font-weight:700}
.tool-err{background:var(--urgent-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
@media (min-width:700px){.tool-help{grid-template-columns:1fr 1fr}.tool-cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.tool-sch-wrap{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start}.tool-detail{position:sticky;top:90px}}
/* ---- strumenti, aspetto v24 ---- */
.tool{border:1px solid var(--line);border-top:4px solid var(--accent);box-shadow:var(--shadow);padding:14px}
.tool-h{margin-bottom:10px}
.tool-how{font-size:15px;color:var(--muted);margin-top:2px}
.tool-how .md p{margin:0}
.tool-obs{margin-top:12px;font-size:15px}
.tool-obs .md{margin-top:6px}
.tool-obs.end{background:var(--ok-soft);border-radius:12px;padding:10px 14px}
.tool-obs.end .eyebrow{color:var(--ok)}
.tool-obs-t{background:none;border:0;padding:4px 0;font-weight:700;color:var(--accent);cursor:pointer;font-size:15px;min-height:36px}
.tool-score{margin-left:auto;font-size:14px;font-weight:700;color:var(--ok)}
.tool-pred{border:2px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.tool-pred>.eyebrow{color:var(--warn)}
.tool-pred .tool-opts{margin:8px 0 0}
.tool-pred .box{margin-top:10px}
.tool-cols.dim{opacity:.55}
.tool-tbl{font-size:14.5px}
.tool-tbl td:first-child{font-weight:600}
.tool-tbl tr.cur td{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 0 transparent}
.tool-tbl tr.cur td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.tool-tbl tr.chg td,.tool-tbl td.chg{background:var(--ok-soft)!important;transition:background .3s}
.tool-tbl td.chg{font-weight:800;box-shadow:inset 0 0 0 2px var(--ok)}
.tone{display:inline-block;padding:1px 9px;border-radius:999px;font-weight:700;font-size:.92em;white-space:nowrap}
.tone.ok{background:var(--ok-soft);color:var(--ok)}.tone.warn{background:var(--warn-soft);color:var(--warn)}
.tone.urgent{background:var(--urgent-soft);color:var(--urgent)}.tone.acc{background:var(--accent-soft);color:var(--accent)}
.tone.mut{background:var(--surface-2);color:var(--muted)}
.tool-tra{display:flex;flex-direction:column;align-items:center;gap:0;padding:2px 0}
.tool-tra svg{width:12px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool-tra span{font-size:13px;color:var(--muted);font-weight:600}
.tool-node{border-left:5px solid var(--accent-soft)}
.tool-node.on{border-left-color:var(--accent)}
/* classifica: una carta alla volta, poi le caselle in cui metterla */
.cls-top{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.cls-top .num{font-weight:800;color:var(--muted);font-size:14px}
.cls-top .btn{margin-left:auto}
.cls-card{border:2px dashed var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.cls-ct{font-size:1.08em;font-weight:700;margin-top:2px}
.cls-fb{border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:15px}
.cls-fb.ok{background:var(--ok-soft)}
.cls-card .cls-fb{margin:8px 0 0}
.cls-fb.no{background:var(--urgent-soft)}
.cls-bins{display:grid;gap:8px}
.cls-bin{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;min-height:64px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer}
.cls-bin:not(:disabled):hover{border-color:var(--accent)}
.cls-bin.no{border-color:var(--urgent);background:var(--urgent-soft)}
.cls-bin:disabled{cursor:default}
.cls-bh{font-weight:800;color:var(--accent);font-size:15px}
.cls-in{display:flex;flex-wrap:wrap;gap:5px}
.cls-chip{font-size:13.5px;line-height:1.3;padding:3px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.cls-chip.re{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.cls-chip.new{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.cls-grid{display:grid;gap:8px;align-items:stretch}
.cls-ax{font-weight:800;color:var(--accent);font-size:14px;align-self:end;text-align:center;padding:0 2px}

.cls-why{margin:6px 0 0;padding-left:1.2em}
.cls-why li{margin:.3em 0}
@media (min-width:700px){.cls-bins.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.cls-bins.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* formule dentro gli strumenti (v26): un po' più grandi, la frazione in linea altrimenti si legge male */
.cls-ct .katex{font-size:1.45em}
.tool-opt .katex,.cls-chip .katex,.cls-fb .katex,.tool-tbl .katex,.cls-why .katex{font-size:1.18em}
/* laboratori (v25): bit da accendere, ruota dei valori, letture, sfide */
.lab-sf{margin-bottom:12px}
.lab-sfh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lab-sfh .num{font-weight:800;color:var(--muted);font-size:14px}
.lab-sfh .btn{margin-left:auto}
.lab-goal{border:2px dashed var(--accent);border-radius:14px;padding:10px 14px;font-weight:700;font-size:1.04em}
.lab-goal .eyebrow{display:block;font-weight:800}
.lab-done{list-style:none;margin:8px 0 0;padding:0;font-size:14px;color:var(--ok)}
.lab-done li{margin:2px 0}
.lab-sf .cls-fb{margin:0 0 8px}
.lab-bits{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;max-width:calc(var(--n) * 86px)}
.lab-bit{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 6px;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;font-weight:800;line-height:1.1;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.lab-bit.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lab-bit small{font-family:var(--f-body);font-size:12px;font-weight:700;opacity:.8}
.lab-bit small.neg{color:var(--urgent)}
.lab-bit.on small.neg{color:inherit}
.lab-wl{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:4px 0 0}
.lab-wl .neg{color:var(--urgent)}
.lab-ops{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.lab-ops .btn{min-height:44px}
.lab-ev{border-radius:10px;padding:8px 12px;margin:0 0 12px;font-weight:600;font-size:15px}
.lab-ev.riporto{background:var(--accent-soft)}
.lab-ev.overflow{background:var(--urgent-soft)}
.lab-ev.info{background:var(--surface-2)}
.lab-main{display:grid;gap:12px;align-items:start}
.lab-read{display:grid;gap:8px}
.lab-r{background:var(--surface-2);border-radius:12px;padding:8px 12px;min-width:0}
.lab-r .eyebrow{display:block}
.lab-r b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.15}
.lab-r small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.lab-wheel{width:100%;max-width:320px;justify-self:center}
.lab-ring{fill:none;stroke:var(--line);stroke-width:2}
.lab-neg{fill:none;stroke:var(--urgent-soft);stroke-width:16;stroke-linecap:round}
.lab-dot{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.lab-dot.cur{fill:var(--accent);stroke:var(--accent)}
.lab-u,.lab-s{font-size:12px;fill:var(--muted);font-weight:600}
.lab-s.n{fill:var(--urgent)}
.lab-u.cur,.lab-s.cur{fill:var(--accent);font-weight:800;font-size:14px}
.lab-car{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 3}
.lab-ovf{stroke:var(--urgent);stroke-width:2.5;stroke-dasharray:4 3}
.lab-seamt{display:none}
.lab-cbits{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:800;fill:var(--ink)}
.lab-ct{font-size:11px;font-weight:700;fill:var(--accent)}
.lab-ct.ovf{fill:var(--urgent)}
@media (min-width:700px){.lab-main{grid-template-columns:minmax(0,300px) minmax(0,1fr)}.lab-main>.lab-read:only-child{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.sheet .lab-main{grid-template-columns:1fr}
/* nel riquadro di ripasso lo spazio è stretto: una colonna sola */
.sheet .tool-cols,.sheet .tool-sch-wrap,.sheet .tool-help{grid-template-columns:1fr}
.sheet .tool-detail{position:static}

/* indice dell'argomento: si vede solo sugli schermi larghi (PC) */
.toc{display:none}

/* ---------- PC e schermi larghi ----------
   Telefono (sotto 700 px) e tablet (700-899) restano come prima, con il menu in basso.
   Da 900 px: menu in alto, testo un po' più grande.
   Da 1200 px: due colonne. Nell'argomento c'è l'indice delle sezioni a destra. */
@media (hover:hover) and (pointer:fine){
  .row:not(.off):hover,.acc-h:hover{background:var(--surface-2)}
  .btn:not(:disabled):hover{filter:brightness(.96)}
  .btn.primary:not(:disabled):hover{filter:brightness(1.1)}
  .nav button[aria-selected="false"]:hover{color:var(--ink);background:var(--surface-2)}
  .back:hover{text-decoration:underline}
}
@media (min-width:900px){
  .toast{bottom:32px}
  .md{font-size:17px}
  .md pre.codeblock code{font-size:14px}
  /* il menu in alto resta fisso: i titoli raggiunti con lo scorrimento non ci finiscono sotto */
  .acc-h,.sec-h{scroll-margin-top:84px}
}
@media (min-width:1200px){
  .app{max-width:1180px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .grid2>.more-btn{grid-column:1/-1}
  #v-adesso,#v-dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #v-adesso>.page-h,#v-adesso>.note,#v-adesso>section:only-of-type,#v-adesso>.upd,#v-adesso>.full,#v-dati>.page-h,#v-dati>.note{grid-column:1/-1}
  /* in Dati l'elenco dei pacchetti è lungo: va in fondo, largo quanto la pagina */
  #v-dati>.pk{grid-column:1/-1;order:1}
  #v-dati>.note{order:2}
  .topic{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:start}
  .toc{display:block;position:sticky;top:80px;max-height:calc(100vh - 96px);overflow:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 10px 10px}
  .toc .eyebrow{padding:0 8px 6px}
  .toc ol{list-style:none;margin:0;padding:0}
  .toc button{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:6px 8px;border-radius:9px;font-size:14px;line-height:1.3}
  .toc button:hover{background:var(--surface-2)}
  .toc button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .toc .dot{width:18px;height:18px;border-width:2px;margin-top:0}
  .toc .dot svg{width:11px;height:11px}
  .toc .jump{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .toc .jump button{font-weight:700;color:var(--muted)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
"use strict";
const TABS=['adesso','esami','prove','vittorie','dati'];
const DB_NAME='studio-db', DB_VER=1;
const LS_TIP='st-tip-seen', LS_TAB='st-tab';
const LEVELS={intuizione:'Intuizione',definizione:'Definizione',ragionamento:'Ragionamento',errori_comuni:'Errori comuni',riepilogo:'Riepilogo'};
const LVL_ORDER=Object.keys(LEVELS);
const EX_LEVELS={base:'Base',medio:'Medio',difficile:'Difficile'};
const TIPI=['nuovo_esame','contenuti','piano_studio','guida_esami','aggiornamento_piano','ripasso'];
const MAX_KB=250;/* sopra si avvisa soltanto; era 80 con i pacchetti incollati a mano, 120 fino alla v19: gli strumenti interattivi pesano */
const MSH=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const GSH=['dom','lun','mar','mer','gio','ven','sab'];
const IC={
  right:'<svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>'
};

/* ---------- date ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>keyOf(new Date());
/* un periodo di giorni { dal, al } (v27: le finestre delle prove finali) */
const okPer=q=>!!q&&typeof q==='object'&&isDate(q.dal)&&isDate(q.al)&&q.dal<=q.al;
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/86400000);
const shortDate=k=>{const d=parseKey(k);return d.getDate()+' '+MSH[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const dayDate=k=>GSH[parseKey(k).getDay()]+' '+shortDate(k);
function untilText(k){const n=diffDays(todayKey(),k);
  if(n===0)return 'oggi';if(n===1)return 'domani';if(n<0)return 'passato';
  return n<70?'tra '+n+' giorni':'tra '+Math.round(n/7)+' settimane'}

/* ---------- util ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const arr=v=>Array.isArray(v)?v:[];
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const pl=(n,one,many)=>n+' '+(n===1?one:many);
const fmtBytes=b=>b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1024/1024).toLocaleString('it-IT',{maximumFractionDigits:1})+' MB';
function listIt(a){a=a.filter(Boolean);return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true},2800)}
/* aperta dall'icona (app installata) e non da una scheda del browser */
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- Markdown minimale con formule KaTeX e codice ----------
   Prima si tolgono codice e formule, poi si fa l'escape di tutto il resto: nessun HTML del pacchetto arriva alla pagina.
   Il codice (```...``` su righe proprie, oppure `...` in linea) resta com'è: niente corsivi, titoli o formule dentro. */
const mdCache=new Map();
const CODE_BLOCK=/^[ \t]*```([^\n`]*)\n([\s\S]*?)^[ \t]*```[ \t]*$/gm, CODE_INLINE=/`([^`\n]+)`/g;
/* il testo senza il codice: serve ai controlli sulle formule, che dentro il codice non valgono */
function stripCode(s){return String(s).replace(/\r\n?/g,'\n').replace(CODE_BLOCK,'').replace(CODE_INLINE,'')}
function tex(src,display){
  if(!window.katex)return '<code>'+esc(src)+'</code>';
  try{return katex.renderToString(src,{displayMode:display,throwOnError:false,strict:'ignore',output:'htmlAndMathml'})}
  catch(e){return '<code class="katex-error">'+esc(src)+'</code>'}
}
/* collegamenti interni: [[id]] oppure [[id|testo]]. Diventano pulsanti che aprono il riquadro di ripasso.
   Si tolgono prima dell'escape, come codice e formule: l'id è controllato con ID_RE, il testo passa da esc(). */
const XREF=/\[\[([a-z0-9][a-z0-9._-]*)(?:\|([^\]\n]{1,160}))?\]\]/g;
/* ---------- tabelle (v24) ----------
   1) Tabelle Markdown: | a | b | con la riga | --- | --- | sotto l'intestazione (:--: al centro, --: a destra).
      Codice, formule e collegamenti sono già stati tolti dal testo, quindi un | dentro `codice` non spezza le celle.
   2) Le vecchie tabelle disegnate nei blocchi ```text (intestazione, riga di ─── a gruppi, righe allineate a colonne)
      diventano tabelle vere: le righe che continuano una cella (prima colonna vuota, oppure solo la prima colonna piena)
      si uniscono alla riga sopra. Se il disegno non si lascia leggere con certezza, resta com'era. */
const TBL_ROW=/^\s*\|.*\|\s*$/,TBL_SEP=/^\s*\|(\s*:?-{3,}:?\s*\|)+\s*$/;
const tblCells=l=>l.trim().replace(/\\\|/g,'\u0001').replace(/^\||\|$/g,'').split('|').map(c=>c.replace(/\u0001/g,'|').trim());
/* una cella che sembra codice C (punto e virgola, graffe, chiamate, operatori) si mostra come codice */
const CODE_CELL=/[;{}#]|\w\(|%[a-z]|->|\+\+|==|!=|&&|\|\|/;
const NUM_CELL=/^[-+−]?[\d][\d\s.,']*%?$/;
function tableHTML(head,rows,al,cell){
  const n=Math.max(head.length,...rows.map(r=>r.length));
  /* colonne di soli numeri: a destra, con le cifre della stessa larghezza */
  const num=[...Array(n).keys()].map(j=>rows.length>0&&rows.every(r=>!r[j]||NUM_CELL.test(r[j]))&&rows.some(r=>r[j]));
  const cls=j=>{const a=al[j]||(num[j]?'r':'');return a?` class="${a==='c'?'tc':'tr'}"`:''};
  /* sul telefono una tabella di frasi (celle lunghe, almeno 3 colonne) diventa una scheda per riga: intestazione accanto al valore */
  const txt=n>=3&&rows.some(r=>r.some(c=>String(c||'').length>28));
  const hd=head.map(h=>esc(String(h||'').replace(/\u0000\w\d*\u0000/g,'').replace(/[*`_]/g,'')));
  const tr=(r,tag)=>'<tr>'+[...Array(n).keys()].map(j=>`<${tag}${cls(j)}${tag==='td'&&txt?` data-h="${hd[j]||''}"`:''}>${txt&&tag==='td'?'<div>'+cell(r[j]||'')+'</div>':cell(r[j]||'')}</${tag}>`).join('')+'</tr>';
  return `<div class="tbl-wrap${txt?' tbl-txt':''}"><table class="tbl"><thead>${tr(head,'th')}</thead><tbody>${rows.map(r=>tr(r,'td')).join('')}</tbody></table></div>`;
}
function asciiTable(src){
  const L=src.replace(/\s+$/,'').split('\n').map(l=>l.replace(/\s+$/,''));
  const si=L.findIndex((l,i)=>i>=1&&i<=3&&/^ *─+( +─+)+ *$/.test(l));
  if(si<1)return null;
  const runs=[...L[si].matchAll(/─+/g)].map(m=>m.index);
  if(runs.length<2||runs.length>8)return null;
  /* fine della tabella: la prima riga vuota (il resto del disegno resta un disegno, sotto) */
  let end=L.findIndex((l,i)=>i>si&&!l.trim());if(end<0)end=L.length;
  const body=L.slice(si+1,end).filter(l=>!/^ *─+( +─+)* *$/.test(l)),rest=L.slice(end).join('\n').replace(/^\n+/,'');
  if(!body.length)return null;
  /* taglia una riga nelle colonne; se un taglio cade dentro una parola, lo sposta allo spazio prima */
  let moved=false;
  const cut=l=>{const pos=[0];
    for(let j=1;j<runs.length;j++){let p=runs[j];
      if(p<l.length&&l[p]!==' '&&l[p-1]!==' '){
        /* la parola tagliata va nella colonna dove ne sta la parte più grande */
        let a=p,b=p;while(a>0&&l[a-1]!==' ')a--;while(b<l.length&&l[b]!==' ')b++;
        moved=true;p=(p-a)>(b-p)?b:a;if(p<=pos[j-1]||(j+1<runs.length&&p>=runs[j+1]))return null}
      /* un solo spazio tra due parole a cavallo della colonna: è una frase che continua, non due celle */
      if(p<l.length){let a=p,b=p;while(a>0&&l[a-1]===' ')a--;while(b<l.length&&l[b]===' ')b++;if(b-a===1&&a>0&&b<l.length)return null}
      pos.push(p)}
    return pos.map((p,j)=>l.slice(p,j+1<pos.length?pos[j+1]:undefined).trim())};
  /* l'intestazione sono le righe (al massimo 2) subito sopra la riga ───; sopra non ci deve essere altro */
  if(si>2||L.slice(0,si).some(l=>!l.trim()))return null;
  /* frecce, riquadri e scritte affiancate dicono che è un disegno, non una tabella: resta com'è */
  if(L.slice(0,end).some(l=>/[│┃┌┐└┘├┤┬┴┼►◄▲▼]|──|─►/.test(l.replace(/^ *─+( +─+)* *$/,''))))return null;
  const headRows=L.slice(0,si).map(cut);if(moved)return null;
  const bodyCells=body.map(cut);
  if(headRows.some(r=>!r)||bodyCells.some(r=>!r))return null;
  if([...headRows,...bodyCells].some(r=>r.some(c=>/\S {3,}\S/.test(c))))return null;
  const head=runs.map((_,j)=>headRows.map(r=>r[j]).filter(Boolean).join(' '));
  /* casi dubbi: allora resta un disegno. Una riga con la prima colonna piena e solo alcune delle altre (è una riga nuova
     o il seguito di quella sopra?), una cella che finisce con «:» o «,», virgolette o parentesi non chiuse */
  const open=c=>(c.split('«').length!==c.split('»').length)||(c.split('(').length!==c.split(')').length);
  if(bodyCells.some(c=>c[0]!==''&&c.slice(1).some(Boolean)&&c.slice(1).some(x=>!x)))return null;
  const isNew=c=>c[0]!==''&&c.slice(1).some(Boolean);
  if(bodyCells.some((c,i)=>i+1<bodyCells.length&&isNew(bodyCells[i+1])&&c.some(x=>/[:,]$/.test(x))))return null;
  const rows=[];
  for(const c of bodyCells){
    const newRow=!rows.length||isNew(c);
    if(newRow)rows.push(c.slice());
    else{const r=rows[rows.length-1];c.forEach((x,j)=>{if(x)r[j]=r[j]?r[j]+' '+x:x})}
  }
  if(rows.some(r=>r.some(open)))return null;
  return tableHTML(head,rows,[],c=>CODE_CELL.test(c)?'<code>'+esc(c)+'</code>':esc(c))+(rest?'<pre class="codeblock diagram"><code>'+esc(rest)+'</code></pre>':'');
}
function md(src){
  src=String(src==null?'':src);
  if(mdCache.has(src))return mdCache.get(src);
  const math=[],code=[],lang=[],refs=[];let hasTool=false;
  let s=src.replace(/\u0000/g,'').replace(/\r\n?/g,'\n');
  s=s.replace(CODE_BLOCK,(m,l,t)=>{code.push(t.replace(/\n$/,''));const lg=l.trim().toLowerCase();lang[code.length-1]=lg;if(lg==='strumento')hasTool=true;return '\u0000C'+(code.length-1)+'\u0000'});
  s=s.replace(CODE_INLINE,(m,t)=>{code.push(t);return '\u0000K'+(code.length-1)+'\u0000'});
  s=s.replace(XREF,(m,id,t)=>{refs.push([id,t||'']);return '\u0000R'+(refs.length-1)+'\u0000'});
  s=s.replace(/\\\$/g,'\u0000D\u0000');
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>{math.push([t,true]);return '\u0000M'+(math.length-1)+'\u0000'});
  s=s.replace(/\$([^$\n]+?)\$/g,(m,t)=>{math.push([t,false]);return '\u0000M'+(math.length-1)+'\u0000'});
  const inline=t=>esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<em>$2</em>')
    .replace(/\u0000M(\d+)\u0000/g,(m,i)=>{const [t,d]=math[+i];return d?'<span class="mathblock">'+tex(t,true)+'</span>':tex(t,false)})
    .replace(/\u0000K(\d+)\u0000/g,(m,i)=>'<code>'+esc(code[+i])+'</code>')
    .replace(/\u0000C(\d+)\u0000/g,(m,i)=>'<code>'+esc(code[+i])+'</code>')
    .replace(/\u0000R(\d+)\u0000/g,(m,i)=>xrefBtn(refs[+i][0],refs[+i][1]))
    .replace(/\u0000D\u0000/g,'$');
  const out=[];let para=[],list=null;
  const flushP=()=>{if(para.length){out.push('<p>'+para.map(inline).join('<br>')+'</p>');para=[]}};
  const flushL=()=>{if(list){out.push('<'+list.tag+'>'+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</'+list.tag+'>');list=null}};
  const lines=s.split(/\r?\n/);
  for(let li=0;li<lines.length;li++){
    const line=lines[li].trimEnd();let m;
    if(!line.trim()){flushP();flushL();continue}
    /* tabella Markdown: | a | b | poi | --- | --- | */
    if(TBL_ROW.test(line)&&li+1<lines.length&&TBL_SEP.test(lines[li+1])){flushP();flushL();
      const head=tblCells(line),al=tblCells(lines[li+1]).map(c=>/^:-+:$/.test(c)?'c':/-:$/.test(c)?'r':'');const rows=[];
      for(li+=2;li<lines.length&&TBL_ROW.test(lines[li].trimEnd());li++)rows.push(tblCells(lines[li]));
      li--;out.push(tableHTML(head,rows,al,inline));continue}
    if((m=/^\s*\u0000C(\d+)\u0000$/.exec(line))){flushP();flushL();const c=code[+m[1]],lg=lang[+m[1]];
      out.push(lg==='strumento'?toolHTML(c):lg==='text'&&asciiTable(c)||'<pre class="codeblock'+(lg==='text'?' diagram':'')+'"><code>'+esc(c)+'</code></pre>');continue}
    if((m=/^\s*#{1,6}\s+(.*)$/.exec(line))){flushP();flushL();out.push('<div class="mh">'+inline(m[1])+'</div>');continue}
    if((m=/^\s*[-*]\s+(.*)$/.exec(line))){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]}}list.items.push(m[1]);continue}
    if((m=/^\s*\d+[.)]\s+(.*)$/.exec(line))){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]}}list.items.push(m[1]);continue}
    if(list){list.items[list.items.length-1]+=' '+line.trim();continue}
    para.push(line);
  }
  flushP();flushL();
  const html='<div class="md">'+out.join('')+'</div>';
  /* uno strumento cambia a ogni passo: quel testo non si tiene in memoria */
  if(!hasTool){if(mdCache.size>800)mdCache.clear();mdCache.set(src,html)}
  return html;
}
/* testo breve su una riga (opzioni delle domande): solo grassetto e codice in linea */
/* dalla v26 anche le formule $...$ (opzioni e celle degli strumenti di Analisi): il codice si toglie prima, la formula passa da KaTeX */
const mdInline=t=>{const k=[];
  return String(t==null?'':t).replace(/`([^`\n]+)`/g,(m,c)=>{k.push('<code>'+esc(c)+'</code>');return '\u0000'+(k.length-1)+'\u0000'})
    .split(/(\$[^$\n]+?\$)/).map((p,i)=>i%2?tex(p.slice(1,-1),false):esc(p).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')).join('')
    .replace(/\u0000(\d+)\u0000/g,(m,i)=>k[+i])};

/* ---------- collegamenti interni e glossario ---------- */
const TERM_TIPI={ufficiale:'Termine ufficiale',uso_comune:'Termine d\'uso comune',semplificazione:'Semplificazione didattica'};
/* trova a cosa punta un id: un argomento, una sua sezione, un termine, una tecnica o un esercizio */
function refFind(id){
  const a0=S.arg.get(id);if(a0)return {k:'arg',a:a0,item:a0};
  for(const a of S.arg.values()){
    if(!id.startsWith(a.id+'.'))continue;
    const secs=sortedSections(a),i=secs.findIndex(s=>s.id===id);
    if(i>=0)return {k:'sez',a,item:secs[i],i,n:secs.length};
    let x=arr(a.termini).find(g=>g&&g.id===id);if(x)return {k:'term',a,item:x};
    x=arr(a.tecniche).find(t=>t&&t.id===id);if(x)return {k:'tec',a,item:x};
    x=arr(a.esercizi).find(t=>t&&t.id===id);if(x)return {k:'ese',a,item:x};
  }
  return null;
}
function refLabel(id){const r=refFind(id);if(!r)return id;
  return r.k==='arg'?r.a.titolo:r.k==='term'?r.item.termine:r.k==='tec'?r.item.nome:r.k==='ese'?'esercizio '+id.split('.').pop():r.item.titolo}
const xrefBtn=(id,t)=>`<button type="button" class="xref${refFind(id)?'':' miss'}" data-act="xref" data-id="${esc(id)}">${esc(t||refLabel(id))}</button>`;
function termHTML(g){
  return `${g.tipo&&TERM_TIPI[g.tipo]?`<div class="chips"><span class="chip acc">${TERM_TIPI[g.tipo]}</span></div>`:''}
    ${arr(g.accezioni).length?`<div class="box"><span class="eyebrow">Significati della parola</span>${md(arr(g.accezioni).map(x=>'- '+String(x).replace(/\n/g,' ')).join('\n'))}</div>`:''}
    ${g.docente?`<div class="box"><span class="eyebrow">Definizione del docente</span>${md(g.docente)}</div>`:''}
    ${g.ufficiale?`<div class="box"><span class="eyebrow">Definizione ufficiale</span>${md(g.ufficiale)}${g.fonte?`<div class="muted small">Fonte: ${esc(g.fonte)}</div>`:''}</div>`:''}
    ${g.nota?`<div style="margin-top:10px">${md(g.nota)}</div>`:''}
    ${g.spiegato_in?`<p class="small" style="margin-top:10px">Lo spieghiamo in: ${xrefBtn(g.spiegato_in)}</p>`:''}`;
}
/* il riquadro di ripasso: mostra la cosa collegata senza lasciare la pagina; «Indietro» se ci arrivi da un altro collegamento */
function refSheetHTML(id){
  const r=refFind(id),back=S.refStack.length>1?`<button class="back" data-act="ref-back">${IC.left}Indietro</button>`:'';
  if(!r)return `${back}<h2>Non lo trovo</h2><p class="muted">Il collegamento porta a «${esc(id)}», che non è tra i contenuti che hai importato. Forse arriva con un pacchetto che non hai ancora scaricato: prova Dati → Aggiorna.</p><div class="foot"><button class="btn" data-act="close">Chiudi</button></div>`;
  let head='',body='',go='',extra='';
  if(r.k==='sez'){head=`<div class="eyebrow">Ripasso · ${esc(r.a.titolo)} · sezione ${r.i+1} di ${r.n}</div><h2>${esc(r.item.titolo)}</h2>`;body=md(r.item.testo);go='Vai alla sezione'}
  else if(r.k==='term'){const g=r.item;
    head=`<div class="eyebrow">Glossario · ${esc(r.a.titolo)}</div><h2>${esc(g.termine)}${g.inglese?` <span class="muted en">(${esc(g.inglese)})</span>`:''}</h2>`;
    body=termHTML(g);extra=`<button class="btn" data-act="open-gloss" data-id="${esc(r.a.esame_id)}">Tutto il glossario</button>`}
  else if(r.k==='arg'){head=`<div class="eyebrow">Argomento</div><h2>${esc(r.a.titolo)}</h2>`;
    body=r.a.mappa?md(r.a.mappa):`<p class="muted">${pl(arr(r.a.sezioni).length,'sezione','sezioni')}.</p>`;go='Apri l\'argomento'}
  else if(r.k==='tec'){const ex=obj(r.item.esempio);
    head=`<div class="eyebrow">Tecnica · ${esc(r.a.titolo)}</div><h2>${esc(r.item.nome)}</h2>`;
    body=(r.item.quando?md(r.item.quando):'')+(ex.testo?`<div class="box"><span class="eyebrow">Esempio</span>${md(ex.testo)}</div>`:'');go='Vai alla tecnica'}
  else{head=`<div class="eyebrow">Esercizio · ${esc(r.a.titolo)}</div><h2>${esc(EX_LEVELS[r.item.livello]||'Esercizio')} · ${esc(id.split('.').pop())}</h2>`;body=md(r.item.testo);go='Vai all\'esercizio'}
  return `${back}${head}<div class="refbody">${body}</div><div class="foot">${go?`<button class="btn primary" data-act="goto-ref" data-id="${esc(id)}">${go}</button>`:''}${extra}<button class="btn" data-act="close">Chiudi</button></div>`;
}
function examTerms(eid){const out=[];
  for(const a of S.arg.values())if(a.esame_id===eid)for(const g of arr(a.termini))if(g&&g.id&&g.termine)out.push({g,a});
  return out.sort((x,y)=>String(x.g.termine).localeCompare(String(y.g.termine),'it',{sensitivity:'base'}))}

/* ---------- strumenti interattivi ----------
   Una raccolta fissa di strumenti scritti qui. Il pacchetto non contiene codice: in un blocco ```strumento
   mette solo dati (JSON) che dicono quale strumento usare e cosa mostrare. Tutti i testi passano da esc() o md(). */
/* icone dei pulsanti degli strumenti (i caratteri ◄ ► ▶ non ci sono nel font dell'app) */
const TIC={l:'<svg class="tic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',r:'<svg class="tic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  play:'<svg class="tic f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg class="tic f" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'};
/* ---------- laboratori (v25) ----------
   Un laboratorio è un piccolo mondo da manipolare: lo studente cambia le cose e vede subito le conseguenze.
   Il codice sta qui, nell'app; il pacchetto sceglie il modulo e dà solo i parametri e le «sfide»
   (obiettivi da raggiungere manipolando: quando lo stato li soddisfa si spuntano da soli e mostrano il perché). */
const LAB_EV={riporto:'riporto oltre l\'ultimo bit',overflow:'overflow con segno',inverti:'bit invertiti',cambio_segno:'−x che non sta nei bit'};
const LAB_VISTE=['senza_segno','con_segno','esadecimale','ottale','ascii'];
const LAB_OPS={'+1':'+1','-1':'−1',not:'Inverti i bit',neg:'Cambia segno (−x)',zero:'Azzera'};
const LAB={
  byte:{
    check(t){
      if(![4,8].includes(t.bit))return '«bit» deve essere 4 oppure 8';
      if(t.vista!==undefined&&!(Array.isArray(t.vista)&&t.vista.length&&t.vista.every(v=>LAB_VISTE.includes(v))))return `«vista» è un elenco tra: ${LAB_VISTE.join(', ')}`;
      if(t.operazioni!==undefined&&!(Array.isArray(t.operazioni)&&t.operazioni.every(v=>LAB_OPS[v])))return `«operazioni» è un elenco tra: ${Object.keys(LAB_OPS).join(', ')}`;
      if(t.ruota!==undefined&&(typeof t.ruota!=='boolean'||(t.ruota&&t.bit!==4)))return '«ruota» (true/false) si usa solo con 4 bit';
      const M=2**t.bit;if(t.valore!==undefined&&!(Number.isInteger(t.valore)&&t.valore>=0&&t.valore<M))return `«valore» è un intero da 0 a ${M-1} (i bit letti senza segno)`;
      const sf=t.sfide;if(sf!==undefined){if(!Array.isArray(sf)||sf.length>10)return '«sfide» è un elenco di al massimo 10 sfide';
        for(let i=0;i<sf.length;i++){const s=sf[i],q=s&&s.quando;
          if(!s||typeof s.testo!=='string'||!s.testo.trim()||(s.poi!==undefined&&typeof s.poi!=='string')||!q||typeof q!=='object'||!Object.keys(q).length)return `sfida ${i+1}: servono «testo», «quando» (e facoltativo «poi»)`;
          for(const [k,v] of Object.entries(q)){
            if(k==='senza_segno'&&!(Number.isInteger(v)&&v>=0&&v<M))return `sfida ${i+1}: senza_segno fuori da 0…${M-1}`;
            else if(k==='con_segno'&&!(Number.isInteger(v)&&v>=-M/2&&v<M/2))return `sfida ${i+1}: con_segno fuori da ${-M/2}…${M/2-1}`;
            else if(k==='bit'&&!(typeof v==='string'&&new RegExp(`^[01]{${t.bit}}$`).test(v)))return `sfida ${i+1}: «bit» è una stringa di ${t.bit} cifre 0/1`;
            else if(k==='evento'&&!LAB_EV[v])return `sfida ${i+1}: «evento» è uno tra ${Object.keys(LAB_EV).join(', ')}`;
            else if(!['senza_segno','con_segno','bit','evento'].includes(k))return `sfida ${i+1}: condizione «${k}» sconosciuta (senza_segno, con_segno, bit, evento)`}}}
      return null},
    html(t,key,st){
      const n=t.bit,M=2**n,v=Number.isInteger(st.v)?st.v:(t.valore||0),sg=v>=M/2?v-M:v,bits=v.toString(2).padStart(n,'0');
      const vista=new Set(t.vista||['senza_segno','con_segno','esadecimale']),signed=vista.has('con_segno');
      const ops=t.operazioni||['+1','-1','not','neg','zero'];
      const lb=(a,label,cls,extra)=>`<button class="btn${cls?' '+cls:''}" data-act="tool" data-key="${key}" data-op="lab" data-a="${a}"${extra||''}>${label}</button>`;
      /* i bit da accendere, con il loro peso sotto: senza segno e, se serve, con segno (solo il primo cambia) */
      const bitBtns=[...bits].map((b,i)=>{const w=2**(n-1-i);
        return `<button class="lab-bit${b==='1'?' on':''}" data-act="tool" data-key="${key}" data-op="lab" data-a="b${n-1-i}" aria-pressed="${b==='1'}" aria-label="bit ${n-1-i}">${b}
          <small>${w}</small>${signed?`<small class="neg">${i===0?'−'+w:'&nbsp;'}</small>`:''}</button>`}).join('');
      const on=[...bits].map((b,i)=>b==='1'?i:-1).filter(i=>i>=0);
      const sumU=on.length?on.map(i=>2**(n-1-i)).join(' + '):'0',sumS=on.length?on.map(i=>i===0?'−'+2**(n-1):String(2**(n-1-i))).join(' + ').replace('+ −','− '):'0';
      const read=[];
      if(vista.has('senza_segno'))read.push(['Senza segno',String(v),`${sumU} = ${v}`]);
      if(signed)read.push(['Con segno (complemento a due)',String(sg).replace('-','−'),`${sumS} = ${String(sg).replace('-','−')}`]);
      if(vista.has('esadecimale'))read.push(['Esadecimale','0x'+v.toString(16).toUpperCase().padStart(n/4,'0'),'ogni 4 bit una cifra: '+bits.match(/.{4}/g).map(q=>q+' → '+parseInt(q,2).toString(16).toUpperCase()).join(', ')]);
      if(vista.has('ottale'))read.push(['Ottale','0'+v.toString(8),'gruppi di 3 bit da destra']);
      if(vista.has('ascii')&&n===8)read.push(['Carattere ASCII',v>=32&&v<127?'«'+String.fromCharCode(v)+'»':'(non stampabile)',v>=128?'oltre 127: ASCII esteso':`codice ${v}`]);
      const ev=st.ev?`<div class="lab-ev ${st.ev.k}">${esc(st.ev.t)}</div>`:'';
      return `<div class="lab-byte">
        <div class="lab-bits" style="--n:${n}">${bitBtns}</div>
        ${signed?`<div class="lab-wl"><span>sotto ogni bit il suo peso; in rosso il peso del primo bit quando leggi <b>con segno</b>. Sulla ruota: fuori senza segno, dentro (in rosso) con segno</span></div>`:'<div class="lab-wl"><span>sotto ogni bit il suo peso</span></div>'}
        <div class="lab-ops">${ops.map(o=>lb(o,LAB_OPS[o],o==='+1'||o==='-1'?'primary':'')).join('')}</div>
        ${ev}
        <div class="lab-main">${t.ruota?labWheel(n,v,signed):''}<div class="lab-read">${read.map(r=>`<div class="lab-r"><span class="eyebrow">${r[0]}</span><b class="num">${esc(r[1])}</b><small>${esc(r[2])}</small></div>`).join('')}</div></div>
      </div>`},
    state(t,st){const n=t.bit,M=2**n,v=Number.isInteger(st.v)?st.v:(t.valore||0);return {v,bits:v.toString(2).padStart(n,'0'),u:v,s:v>=M/2?v-M:v}},
    act(t,st,a){
      const n=t.bit,M=2**n,v=Number.isInteger(st.v)?st.v:(t.valore||0),S=x=>x>=M/2?x-M:x,f=x=>String(x).replace('-','−');let nv=v,ev=null;
      if(/^b\d$/.test(a)){const k=+a.slice(1);if(k<n)nv=v^(1<<k)}
      else if(a==='+1'){nv=(v+1)%M;if(v===M-1)ev={k:'riporto',t:`Riporto oltre l'ultimo bit: ${M-1} + 1 = 0 senza segno. Il ${n+1}° bit non c'è e si perde.`};
        else if(S(v)===M/2-1)ev={k:'overflow',t:`Overflow con segno: ${f(S(v))} + 1 dà ${f(S(nv))}. Due positivi, risultato negativo: il valore giusto (${M/2}) non sta in ${n} bit.`}}
      else if(a==='-1'){nv=(v+M-1)%M;if(v===0)ev={k:'riporto',t:`Prestito oltre l'ultimo bit: 0 − 1 = ${M-1} senza segno, cioè −1 con segno.`};
        else if(S(v)===-M/2)ev={k:'overflow',t:`Overflow con segno: ${f(-M/2)} − 1 dà ${f(S(nv))}. Il valore giusto (${f(-M/2-1)}) non sta in ${n} bit.`}}
      else if(a==='not'){nv=(M-1)^v;ev={k:'info',e:'inverti',t:`Ogni 0 diventa 1 e ogni 1 diventa 0. Con segno: ${f(S(v))} → ${f(S(nv))}, cioè −x − 1. Per avere −x manca il +1.`}}
      else if(a==='neg'){nv=(M-v)%M;ev=S(v)===-M/2?{k:'overflow',e:'cambio_segno',t:`${f(-M/2)} non ha l'opposto in ${n} bit: inverti e aggiungi 1 e torni a ${f(-M/2)}. +${M/2} non ci sta.`}
        :{k:'info',t:`Inverti i bit e aggiungi 1: ${f(S(v))} → ${f(S(nv))}.`}}
      else if(a==='zero')nv=0;
      st.v=nv;st.ev=ev;return ev}
  }
};
/* la ruota dei valori (solo 4 bit): senza segno fuori, con segno dentro, il punto è il valore attuale.
   In alto la cucitura del riporto (15 → 0), in basso quella dell'overflow con segno (7 → −8). */
function labWheel(n,v,signed){
  const M=2**n,cx=150,cy=150,R=104,pt=(i,r)=>{const a=(-90+i*360/M)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const seam=(i,cls,label,dy)=>{const [x1,y1]=pt(i-.5,R-30),[x2,y2]=pt(i-.5,R+30);return `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="lab-seamt ${cls}" x="${cx}" y="${cy+dy}" text-anchor="middle">${label}</text>`};
  let g=`<circle class="lab-ring" cx="${cx}" cy="${cy}" r="${R}"/>`;
  if(signed)g+=`<path class="lab-neg" d="M ${pt(M/2-.5,R)} A ${R} ${R} 0 0 1 ${pt(M-.5,R)}" />`;
  for(let i=0;i<M;i++){const [x,y]=pt(i,R),[ox,oy]=pt(i,R+22),[ix,iy]=pt(i,R-22),cur=i===v,s=i>=M/2?i-M:i;
    g+=`<circle class="lab-dot${cur?' cur':''}${signed&&s<0?' n':''}" cx="${x}" cy="${y}" r="${cur?11:6}"/>`+
       `<text class="lab-u${cur?' cur':''}" x="${ox}" y="${oy+4}" text-anchor="middle">${i}</text>`+
       (signed&&s<0?`<text class="lab-s${cur?' cur':''}${s<0?' n':''}" x="${ix}" y="${iy+4}" text-anchor="middle">${String(s).replace('-','−')}</text>`:'')}
  g+=seam(0,'lab-car',' ',0);
  if(signed)g+=seam(M/2,'lab-ovf',' ',0);
  const bits=v.toString(2).padStart(n,'0');
  g+=`<text class="lab-cbits" x="${cx}" y="${cy+2}" text-anchor="middle">${bits}</text>`+
     `<text class="lab-ct" x="${cx}" y="${cy-30}" text-anchor="middle">riporto ↑</text>`+
     (signed?`<text class="lab-ct ovf" x="${cx}" y="${cy+44}" text-anchor="middle">↓ overflow</text>`:'');
  return `<svg class="lab-wheel" viewBox="0 0 300 300" role="img" aria-label="ruota dei ${M} valori di ${n} bit">${g}</svg>`;
}
/* una sfida è raggiunta quando lo stato (e l'ultimo evento) soddisfano tutte le sue condizioni */
function labMet(q,s,ev){return Object.entries(q).every(([k,v])=>k==='senza_segno'?s.u===v:k==='con_segno'?s.s===v:k==='bit'?s.bits===v:k==='evento'?!!ev&&(ev.e||ev.k)===v:false)}
function labHTML(t,key,st){
  const L=LAB[t.modulo],sf=arr(t.sfide),done=new Set(arr(st.sdone)),cur=sf.findIndex((x,i)=>!done.has(i)),just=Number.isInteger(st.sjust)?sf[st.sjust]:null;
  const sfHTML=sf.length?`<div class="lab-sf"><div class="lab-sfh"><span class="eyebrow">Sfide</span><span class="num">${done.size} di ${sf.length}</span>${done.size||Number.isInteger(st.v)?`<button class="btn small ghost" data-act="tool" data-key="${key}" data-op="reset">Ricomincia</button>`:''}</div>
      ${just?`<div class="cls-fb ok"><b>✓ ${mdInline(just.testo)}</b>${just.poi?' '+mdInline(just.poi):''}</div>`:''}
      ${cur>=0?`<div class="lab-goal"><span class="eyebrow">Adesso prova a…</span><div>${mdInline(sf[cur].testo)}</div></div>`:`<div class="box sol"><span class="eyebrow">Tutte fatte</span>Hai completato le sfide. Continua a giocare con i bit, se vuoi.</div>`}
      ${done.size?`<ul class="lab-done">${sf.map((x,i)=>done.has(i)&&i!==st.sjust?`<li>✓ ${mdInline(x.testo)}</li>`:'').join('')}</ul>`:''}</div>`:'';

  }

/* dopo un tocco su uno strumento: ridisegna la pagina e, se è aperto, il riquadro di ripasso (senza farlo tornare in cima) */
function rerender(){render();if(!$('#backdrop').hidden&&S.refStack.length){const sh=$('#sheet'),y=sh.scrollTop;sh.innerHTML=refSheetHTML(S.refStack[S.refStack.length-1]);sh.scrollTop=y}}
/* il passo passo va avanti di uno; se il passo dopo chiede una previsione, prima la chiede */
function stepNext(t,st){const last=t.passi.length-1,k=st.k||0;if(k>=last)return false;
  const nx=k+1,p=obj(st.pred)[nx];
  if(t.passi[nx].prevedi&&!(p&&p.done)){st.ask=nx;return false}
  st.k=nx;st.ask=null;return true}
function toolAct(b){
  const key=b.dataset.key,op=b.dataset.op,t=toolReg.get(key);if(!t)return;
  const st=S.tool[key]=S.tool[key]||{},n=+b.dataset.n;
  if(op==='obs'){st.obs=!st.obs;rerender();return}
  if(op==='why'){st.why=!st.why;rerender();return}
  if(t.tipo==='laboratorio'){if(op==='lab')labAct(t,st,String(b.dataset.a||''));if(op==='reset')S.tool[key]={};rerender();return}
  if(t.tipo==='passi'){
    const last=t.passi.length-1;st.pred=obj(st.pred);
    if(op==='play'){if(S.play&&S.play.key===key){stopPlay();rerender();return}
      stopPlay();if((st.k||0)>=last)st.k=0;
      S.play={key,timer:setInterval(()=>{const s2=S.tool[key];
        if(!document.querySelector(`.tool[data-key="${key}"]`)||!stepNext(t,s2)){stopPlay();rerender();return}
        rerender()},1800)};rerender();return}
    stopPlay();
    if(op==='next'){const a=Number.isInteger(st.ask)?st.pred[st.ask]:null;
      if(a&&a.done){st.k=st.ask;st.ask=null}else stepNext(t,st)}
    if(op==='prev'){if(Number.isInteger(st.ask))st.ask=null;else st.k=Math.max((st.k||0)-1,0)}
    if(op==='reset'){st.k=0;st.ask=null;st.pred={}}
    if(op==='pred'&&Number.isInteger(st.ask)){const Q=t.passi[st.ask].prevedi,a=st.pred[st.ask]=st.pred[st.ask]||{tried:[]};
      if(!a.done&&n>=0&&n<Q.opzioni.length){a.last=n;
        if(Q.opzioni[n].giusta){a.done=true;a.ok=!a.tried.length}else a.tried=[...new Set(a.tried.concat(n))]}}
    if(op==='reveal'&&Number.isInteger(st.ask)){st.pred[st.ask]={...(st.pred[st.ask]||{tried:[]}),done:true,ok:false};st.k=st.ask;st.ask=null}
  }
  if(t.tipo==='schema'&&op==='pick'&&n>=0&&n<t.nodi.length)st.k=st.k===n&&b.classList.contains('tool-node')?null:n;
  if(t.tipo==='domanda'&&op==='pick'&&n>=0&&n<t.opzioni.length){st.k=n;if(!t.opzioni[n].giusta)st.tried=[...new Set(arr(st.tried).concat(n))]}
  if(t.tipo==='collega'){
    if(op==='reset'){S.tool[key]={};rerender();return}
    if(op==='left'){st.sel=n;st.msg='';st.bad=null}
    if(op==='right'){
      if(!Number.isInteger(st.sel)){st.msg='Prima tocca un elemento a sinistra.';st.bad=null}
      else if(st.sel===n){st.done=[...new Set(arr(st.done).concat(n))];st.msg='Giusto.';st.sel=null;st.bad=null}
      else{st.bad=n;st.msg='Non vanno insieme: riprova.'}
    }
  }
  if(t.tipo==='classifica'){
    if(op==='reset'){S.tool[key]={};rerender();return}
    if(op==='put'){const E=t.elementi;st.placed=obj(st.placed);st.err=obj(st.err);
      const cur=E.findIndex((e,i)=>st.placed[i]==null);
      if(cur>=0&&n>=0&&n<clsCats(t).length){
        if(clsOf(t,E[cur])===n){st.placed[cur]=n;st.last=cur;st.bad=null}
        else{st.bad=n;st.err[cur]=(st.err[cur]||0)+1;st.last=null}}}
  }
  rerender();
}

function tx(stores,fn){return new Promise((res,rej)=>{

  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Salvataggio annullato'));
