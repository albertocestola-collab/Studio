<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
/* Font salvati nel progetto, così funzionano anche offline */
@font-face{font-family:"Bricolage Grotesque";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:italic;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-italic.woff2) format("woff2")}

/* Colore principale: blu profondo. Verde, giallo e rosso sono riservati al semaforo e agli avvisi. */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#141B2B; --muted:#5A6479; --line:#D9DFEA;
  --accent:#2347A6; --accent-ink:#FFFFFF; --accent-soft:#DFE7F8;
  --ok:#1C7C4A; --ok-soft:#D8F0E2; --warn:#A06400; --warn-soft:#FBEBCF; --urgent:#B93A29; --urgent-soft:#F8DDD8;
  --shadow:0 1px 2px rgba(20,27,43,.05),0 6px 18px rgba(20,27,43,.06);
  --backdrop:rgba(14,19,29,.45);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-s:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E131D; --surface:#171E2B; --surface-2:#1D2535; --ink:#E6EBF4; --muted:#97A2B8; --line:#2A3446;
  --accent:#86A6F4; --accent-ink:#0A1530; --accent-soft:#1C2A4A;
  --ok:#5CCB8E; --ok-soft:#173527; --warn:#F0AB45; --warn-soft:#3A2B12; --urgent:#F07D6D; --urgent-soft:#3F201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}

/* navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.brand{display:none}
@media (min-width:900px){
  .app{max-width:860px;padding-bottom:48px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px;margin-bottom:6px}
  .brand{display:block;font-family:var(--f-display);font-weight:800;font-size:20px}
  .nav{position:static;border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
  .nav button{flex-direction:row;gap:7px;padding:8px 14px;font-size:15px;max-width:none}
  .nav button svg{width:19px;height:19px}
}

.banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--warn-soft);border-radius:var(--r-s);padding:10px 12px 10px 14px;margin-bottom:12px;font-size:15px}
.banner button{flex:none;font-weight:700;color:var(--warn);padding:2px 4px}

/* card e testi */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.page-h{font-size:30px;font-weight:800;line-height:1.1}
.sec-h{font-size:20px;font-weight:800;margin:6px 0 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--urgent-soft);color:var(--urgent)}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface-2);color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:58px;font-size:18px;border-radius:14px}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.armed{background:var(--urgent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.btnrow .btn.ghost{flex:0 0 auto}
.more-btn{width:100%;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;min-height:40px;padding-right:8px}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* adesso */
.now{border-left:6px solid var(--accent)}
.upd{border-left:6px solid var(--ok)}
.upd .eyebrow{color:var(--ok)}
.now .what{font-family:var(--f-display);font-size:clamp(23px,6vw,30px);font-weight:800;line-height:1.15;margin:4px 0 6px;overflow-wrap:anywhere}
.deadline{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border-left:6px solid var(--warn)}
.deadline .eyebrow{color:var(--warn)}
.dl-what{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.dl-book{font-size:14px;font-weight:600}
.dl-book.open{color:var(--ok)}.dl-book.wait{color:var(--muted)}.dl-book.closed{color:var(--urgent)}
.cal-p{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.cal .eyebrow+.cal-p{border-top:0;padding-top:0}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cal-d{font-size:16px}
.cal-req{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.req{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;padding:6px 4px;border-radius:10px}
.req:disabled{cursor:default;opacity:1}
.req .req-t{flex:1;min-width:0;overflow-wrap:anywhere}
.box-c{width:24px;height:24px;flex:none;border:2px solid var(--muted);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink)}
.req.ok .box-c{background:var(--ok);border-color:var(--ok)}
.req.ok .req-t{color:var(--muted);text-decoration:line-through}
/* piano di studio (v16) */
.pl-list{display:flex;flex-direction:column}
.pl-it{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:52px}
.pl-it:first-child{border-top:0}
.pl-chk{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;margin-left:-8px}
.pl-it.ok .box-c{background:var(--ok);border-color:var(--ok)}
.pl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left;padding:6px 0;border-radius:8px}
button.pl-t .t{color:var(--accent)}
.pl-t .t{font-weight:700;overflow-wrap:anywhere}
.pl-t .m{font-size:13.5px;color:var(--muted)}
.pl-it.ok .t{color:var(--muted);text-decoration:line-through}
.day-h,.sem-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sem{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.eyebrow+.sem{border-top:0;padding-top:2px}
.done-card{border-left-color:var(--ok)}
.done-card .eyebrow{color:var(--ok)}
.sub-h{font-size:20px;font-weight:800;margin:6px 0 -4px}
.examrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.examrow:first-child{border-top:0;padding-top:0}
.examrow{flex-wrap:wrap}
.examrow b{overflow-wrap:break-word;min-width:0}

/* righe toccabili */
.cap-h{display:flex;flex-direction:column;gap:2px;font-size:17px;font-weight:800;line-height:1.25;margin:14px 2px 2px;overflow-wrap:anywhere}
.stack-s>.cap-h:first-child{margin-top:4px}
.cap-h .small{font-weight:400;font-family:var(--f-body)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;min-height:60px}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row svg.go{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;flex:none}
.row.off{opacity:.6;cursor:default;box-shadow:none;background:var(--surface-2)}
.row .n{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-weight:800;font-family:var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px}

/* visualizzatore */
.nextstep{background:var(--accent-soft);border-radius:14px;padding:12px 14px}
.nextstep .eyebrow{color:var(--accent)}
.incerto{background:var(--warn-soft);border-radius:14px;padding:12px 14px}
.incerto .eyebrow{color:var(--warn)}
.acc{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:60px}
.acc-h .txt{flex:1;min-width:0}
.acc-h .t{font-weight:700;overflow-wrap:anywhere;display:block}
.acc-h .chev{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.4;flex:none;transition:transform .2s}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-b{padding:0 16px 16px}
.dot{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center}
.dot svg{width:15px;height:15px;stroke:var(--accent-ink);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.on svg{opacity:1}
.readbtn.on{background:var(--accent-soft);color:var(--accent)}
/* esercizi con le caselle (v17) */
.ans{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ans-row{display:flex;flex-direction:column;gap:4px}
.ans-l{font-weight:700;font-size:14.5px}
.ans-line{display:flex;gap:8px;align-items:center}
.ans-in{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-width:420px}
.ans-in.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans-in.bad{border-color:var(--urgent)}
.ans-mark{font-weight:800;font-size:20px;flex:none}
.ans-mark.ok{color:var(--ok)}.ans-mark.bad{color:var(--urgent)}
.ans-msg{font-size:14.5px;color:var(--urgent);background:var(--urgent-soft);border-radius:10px;padding:6px 10px}
.ans-ok{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 14px;font-weight:700}
.ans-no{font-size:14.5px;color:var(--muted)}
.box{background:var(--surface-2);border-radius:12px;padding:10px 14px;margin-top:10px}
.box .eyebrow{display:block;margin-bottom:2px}
.box.sol{background:var(--ok-soft)}
.box.sol .eyebrow{color:var(--ok)}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps li{display:flex;gap:10px;background:var(--surface-2);border-radius:12px;padding:10px 12px;counter-increment:st;animation:up .2s ease}
.steps li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.steps li>div{min-width:0;flex:1}
/* «Mettiti alla prova»: esercizi dentro la sezione, subito dopo la teoria che serve */
.tryit{margin-top:14px;padding:12px;border-radius:14px;background:var(--ok-soft)}
.tryit>.eyebrow{color:var(--ok);margin-bottom:8px}
.tryit .card.ex{box-shadow:none}
.toc .tx{font-weight:400;color:var(--muted);font-size:12.5px}
/* sul telefono il riquadro dentro il riquadro ruba spazio al codice: margini più stretti */
@media (max-width:420px){.tryit{padding:8px;margin-left:-8px;margin-right:-8px}.tryit .card.ex{padding:12px 10px}}

/* testo di studio (Markdown) */
.md{overflow-wrap:break-word;min-width:0}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .7em}
.md ul,.md ol{margin:0 0 .7em;padding-left:1.3em}
.md li{margin:.15em 0}
.md .mh{font-family:var(--f-display);font-weight:800;font-size:18px;margin:1em 0 .4em}
.md .mathblock{display:block;overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.3em 0;-webkit-overflow-scrolling:touch}
.md .katex{font-size:1.08em}
.md .katex-error{color:var(--urgent)}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 .3em;overflow-wrap:anywhere}
.md pre.codeblock{margin:.3em 0 .8em;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;line-height:1.45;tab-size:4}
.md pre.codeblock code{display:block;width:max-content;min-width:100%;background:none;border:0;padding:0;font-size:clamp(11.5px,3vw,13.5px);white-space:pre;overflow-wrap:normal}
/* sul telefono (375 px) il codice scende a 11,5 px e il riquadro ha margini più stretti:
   così righe di C fino a 46 caratteri stanno nello schermo senza scorrere di lato */
@media (max-width:420px){.md pre.codeblock{padding:10px 9px}}
/* disegni (```text): righe più vicine, così le linee verticali │ dei riquadri si toccano e non sembrano tratteggiate */
.md pre.codeblock.diagram{line-height:1.2}

/* vittorie e dati */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13.5px;color:var(--muted)}
.win{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.win:first-child{border-top:0}
.win .d{flex:none;width:58px;font-weight:700;color:var(--accent);font-size:14px}
.win .w{min-width:0;overflow-wrap:anywhere}
.empty{padding:16px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.note{font-size:14px;color:var(--muted)}

/* import */
textarea,.field{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
textarea:focus,.field:focus{outline:none;border-color:var(--accent)}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:180px;resize:vertical}
.msg{border-radius:12px;padding:12px 14px}
.msg.err{background:var(--urgent-soft)}
.msg.err .eyebrow{color:var(--urgent)}
.msg.okk{background:var(--ok-soft)}
.msg.okk .eyebrow{color:var(--ok)}
.msg.wrn{background:var(--warn-soft)}
.msg.wrn .eyebrow{color:var(--warn)}
.msg ul{margin:6px 0 0;padding-left:1.2em}
.msg li{margin:4px 0;overflow-wrap:anywhere}
.msg pre{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--surface);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.lbl{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field[type=date]{min-height:48px;-webkit-appearance:none;appearance:none}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px}
.check input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.batch li{display:flex;gap:8px;align-items:baseline;list-style:none}
.batch ul{padding-left:0}
.batch .ico{flex:none;font-weight:800}

/* esami: totale ore e ordine */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.card.tot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card.tot b{font-family:var(--f-display);font-size:24px;font-weight:800}
.sortbtns{display:flex;gap:6px;flex:none}
.sortbtns .btn{min-width:44px;padding:0;font-size:18px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;font-weight:700;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* pannello che sale dal basso */
.backdrop{position:fixed;inset:0;z-index:40;background:var(--backdrop);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:22px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:12px}
.sheet .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sheet .foot .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* collegamenti interni, riquadro di ripasso, glossario, «Prima di iniziare», mappa */
.xref{display:inline;font-weight:650;color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:3px;text-align:left}
.xref:hover{text-decoration-style:solid}
.xref.miss{color:var(--muted)}
.prereq{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:6px solid var(--accent)}
.prereq .eyebrow{color:var(--accent)}
.prereq ul{margin:6px 0 8px;padding-left:1.1em}
.prereq li{margin:7px 0}
.prereq .why{color:var(--muted);font-size:15px}
.prereq .why .md p{margin:2px 0 0}
.mappa .acc-h .t{font-weight:600}
.sheet .refbody{margin-bottom:12px}
.sheet .refbody .box:first-child{margin-top:0}
.en{font-weight:500;font-size:.78em}
.box.bad{background:var(--urgent-soft)}
.box.bad .eyebrow{color:var(--urgent)}
.gl[hidden]{display:none}
/* strumenti interattivi */
.tool{margin:14px 0 18px;border:2px solid var(--accent-soft);border-radius:16px;padding:12px;background:var(--surface);font-size:16px}
.tool-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.tool-h .eyebrow{color:var(--accent)}
.tool-h b{font-size:1.08em}
.tool-help{display:grid;gap:8px;margin-bottom:10px;font-size:15px}
.tool-help>div{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.tool-help .md p{margin:2px 0}
.tool-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tool-ctrl .btn{min-height:42px;padding:0 14px}
.tool-ctrl .btn:disabled{opacity:.45;cursor:default}
.tic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tic.f{fill:currentColor;stroke:none}
.tool-ctrl .btn{gap:6px}
.tool-ctrl .num{font-weight:800;color:var(--muted);margin:0 4px;font-variant-numeric:tabular-nums}
.tool-nota{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:10px;min-height:3.2em}
.tool-nota .md p{margin:2px 0}
.tool-cols{display:grid;gap:12px}
.tool-col{min-width:0;display:flex;flex-direction:column;gap:8px}
.tool-colh{font-weight:800;color:var(--accent);text-transform:uppercase;font-size:13px;letter-spacing:.06em;border-bottom:2px solid var(--accent-soft);padding-bottom:3px}
.tool-cnote{font-size:15px;color:var(--muted)}
.tool-cnote .md p{margin:0}
.tool-panel .eyebrow{display:block;margin-bottom:3px}
.tool-pre{margin:0;padding:6px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5}
.tool-pre .ln{display:block;white-space:pre;padding:0 10px;border-left:4px solid transparent;min-width:max-content;transition:background .25s}
.tool-pre .ln.chg{background:var(--ok-soft)}
.tool-pre .ln.cur{background:var(--accent-soft);border-left-color:var(--accent);font-weight:700}
.tool-sch-wrap{display:grid;gap:12px}
.tool-schema{display:flex;flex-direction:column}
.tool-node{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);font-weight:700;min-height:46px}
.tool-node small{font-weight:500;color:var(--muted);font-size:13.5px}
.tool-node.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tool-tra{text-align:center;color:var(--muted);font-size:13px;padding:2px 6px;line-height:1.3}
.tool-detail{background:var(--surface-2);border-radius:12px;padding:10px 14px;min-height:80px;min-width:0}
.tool-detail>.eyebrow{display:block;margin-bottom:2px;color:var(--accent)}
.tool-opts{display:grid;gap:8px;margin:8px 0}
.tool-opt{text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;min-height:46px;overflow-wrap:anywhere}
.tool-opt code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
.tool-opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.tool-opt.no{border-color:var(--urgent);background:var(--urgent-soft)}
.tool-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tool-opt.tried{opacity:.55}
.tool-opt:disabled{cursor:default}
.tool-match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.tool-match>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.tool-ok{color:var(--ok);font-weight:700}
.tool-no{color:var(--urgent);font-weight:700}
.tool-err{background:var(--urgent-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
@media (min-width:700px){.tool-help{grid-template-columns:1fr 1fr}.tool-cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.tool-sch-wrap{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start}.tool-detail{position:sticky;top:90px}}
/* nel riquadro di ripasso lo spazio è stretto: una colonna sola */
.sheet .tool-cols,.sheet .tool-sch-wrap,.sheet .tool-help{grid-template-columns:1fr}
.sheet .tool-detail{position:static}

/* indice dell'argomento: si vede solo sugli schermi larghi (PC) */
.toc{display:none}

/* ---------- PC e schermi larghi ----------
   Telefono (sotto 700 px) e tablet (700-899) restano come prima, con il menu in basso.
   Da 900 px: menu in alto, testo un po' più grande.
   Da 1200 px: due colonne. Nell'argomento c'è l'indice delle sezioni a destra. */
@media (hover:hover) and (pointer:fine){
  .row:not(.off):hover,.acc-h:hover{background:var(--surface-2)}
  .btn:not(:disabled):hover{filter:brightness(.96)}
  .btn.primary:not(:disabled):hover{filter:brightness(1.1)}
  .nav button[aria-selected="false"]:hover{color:var(--ink);background:var(--surface-2)}
  .back:hover{text-decoration:underline}
}
@media (min-width:900px){
  .toast{bottom:32px}
  .md{font-size:17px}
  .md pre.codeblock code{font-size:14px}
  /* il menu in alto resta fisso: i titoli raggiunti con lo scorrimento non ci finiscono sotto */
  .acc-h,.sec-h{scroll-margin-top:84px}
}
@media (min-width:1200px){
  .app{max-width:1180px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .grid2>.more-btn{grid-column:1/-1}
  #v-adesso,#v-dati{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #v-adesso>.page-h,#v-adesso>.note,#v-adesso>section:only-of-type,#v-adesso>.upd,#v-adesso>.full,#v-dati>.page-h,#v-dati>.note{grid-column:1/-1}
  /* in Dati l'elenco dei pacchetti è lungo: va in fondo, largo quanto la pagina */
  #v-dati>.pk{grid-column:1/-1;order:1}
  #v-dati>.note{order:2}
  .topic{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:start}
  .toc{display:block;position:sticky;top:80px;max-height:calc(100vh - 96px);overflow:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 10px 10px}
  .toc .eyebrow{padding:0 8px 6px}
  .toc ol{list-style:none;margin:0;padding:0}
  .toc button{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:6px 8px;border-radius:9px;font-size:14px;line-height:1.3}
  .toc button:hover{background:var(--surface-2)}
  .toc button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .toc .dot{width:18px;height:18px;border-width:2px;margin-top:0}
  .toc .dot svg{width:11px;height:11px}
  .toc .jump{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .toc .jump button{font-weight:700;color:var(--muted)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Studio</div>
    <nav class="nav" role="tablist" aria-label="Sezioni">
      <button role="tab" data-tab="adesso" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>Adesso</button>
      <button role="tab" data-tab="esami" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 5.5C5.5 4.5 9 4.5 12 6.5v13c-3-2-6.5-2-9-1z"/><path d="M21 5.5c-2.5-1-6-1-9 1v13c3-2 6.5-2 9-1z"/></svg>Esami</button>
      <button role="tab" data-tab="vittorie" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg>Vittorie</button>
      <button role="tab" data-tab="dati" aria-selected="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Dati</button>
    </nav>
  </div>
  <div id="banner" class="banner" hidden></div>
  <main id="v-adesso" class="stack"></main>
  <main id="v-esami" class="stack" hidden></main>
  <main id="v-vittorie" class="stack" hidden></main>
  <main id="v-dati" class="stack" hidden></main>
</div>
<div id="backdrop" class="backdrop" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="file-in" accept=".json,.txt,application/json,text/plain" multiple hidden>

<script src="katex/katex.min.js"></script>
<script>
(function(){
"use strict";
const TABS=['adesso','esami','vittorie','dati'];
const DB_NAME='studio-db', DB_VER=1;
const LS_TIP='st-tip-seen', LS_TAB='st-tab';
const LEVELS={intuizione:'Intuizione',definizione:'Definizione',ragionamento:'Ragionamento',errori_comuni:'Errori comuni',riepilogo:'Riepilogo'};
const LVL_ORDER=Object.keys(LEVELS);
const EX_LEVELS={base:'Base',medio:'Medio',difficile:'Difficile'};
const TIPI=['nuovo_esame','contenuti','piano_studio','aggiornamento_piano','ripasso'];
const MAX_KB=120;/* sopra si avvisa soltanto; era 80 quando i pacchetti si incollavano a mano sul telefono */
const MSH=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const GSH=['dom','lun','mar','mer','gio','ven','sab'];
const IC={
  right:'<svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>'
};

/* ---------- date ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>keyOf(new Date());
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/86400000);
const shortDate=k=>{const d=parseKey(k);return d.getDate()+' '+MSH[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const dayDate=k=>GSH[parseKey(k).getDay()]+' '+shortDate(k);
function untilText(k){const n=diffDays(todayKey(),k);
  if(n===0)return 'oggi';if(n===1)return 'domani';if(n<0)return 'passato';
  return n<70?'tra '+n+' giorni':'tra '+Math.round(n/7)+' settimane'}

/* ---------- util ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const arr=v=>Array.isArray(v)?v:[];
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const pl=(n,one,many)=>n+' '+(n===1?one:many);
const fmtBytes=b=>b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1024/1024).toLocaleString('it-IT',{maximumFractionDigits:1})+' MB';
function listIt(a){a=a.filter(Boolean);return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true},2800)}
/* aperta dall'icona (app installata) e non da una scheda del browser */
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- Markdown minimale con formule KaTeX e codice ----------
   Prima si tolgono codice e formule, poi si fa l'escape di tutto il resto: nessun HTML del pacchetto arriva alla pagina.
   Il codice (```...``` su righe proprie, oppure `...` in linea) resta com'è: niente corsivi, titoli o formule dentro. */
const mdCache=new Map();
const CODE_BLOCK=/^[ \t]*```([^\n`]*)\n([\s\S]*?)^[ \t]*```[ \t]*$/gm, CODE_INLINE=/`([^`\n]+)`/g;
/* il testo senza il codice: serve ai controlli sulle formule, che dentro il codice non valgono */
function stripCode(s){return String(s).replace(/\r\n?/g,'\n').replace(CODE_BLOCK,'').replace(CODE_INLINE,'')}
function tex(src,display){
  if(!window.katex)return '<code>'+esc(src)+'</code>';
  try{return katex.renderToString(src,{displayMode:display,throwOnError:false,strict:'ignore',output:'htmlAndMathml'})}
  catch(e){return '<code class="katex-error">'+esc(src)+'</code>'}
}
/* collegamenti interni: [[id]] oppure [[id|testo]]. Diventano pulsanti che aprono il riquadro di ripasso.
   Si tolgono prima dell'escape, come codice e formule: l'id è controllato con ID_RE, il testo passa da esc(). */
const XREF=/\[\[([a-z0-9][a-z0-9._-]*)(?:\|([^\]\n]{1,160}))?\]\]/g;
function md(src){
  src=String(src==null?'':src);
  if(mdCache.has(src))return mdCache.get(src);
  const math=[],code=[],lang=[],refs=[];let hasTool=false;
  let s=src.replace(/\u0000/g,'').replace(/\r\n?/g,'\n');
  s=s.replace(CODE_BLOCK,(m,l,t)=>{code.push(t.replace(/\n$/,''));const lg=l.trim().toLowerCase();lang[code.length-1]=lg;if(lg==='strumento')hasTool=true;return '\u0000C'+(code.length-1)+'\u0000'});
  s=s.replace(CODE_INLINE,(m,t)=>{code.push(t);return '\u0000K'+(code.length-1)+'\u0000'});
  s=s.replace(XREF,(m,id,t)=>{refs.push([id,t||'']);return '\u0000R'+(refs.length-1)+'\u0000'});
  s=s.replace(/\\\$/g,'\u0000D\u0000');
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>{math.push([t,true]);return '\u0000M'+(math.length-1)+'\u0000'});
  s=s.replace(/\$([^$\n]+?)\$/g,(m,t)=>{math.push([t,false]);return '\u0000M'+(math.length-1)+'\u0000'});
  const inline=t=>esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<em>$2</em>')
    .replace(/\u0000M(\d+)\u0000/g,(m,i)=>{const [t,d]=math[+i];return d?'<span class="mathblock">'+tex(t,true)+'</span>':tex(t,false)})
    .replace(/\u0000K(\d+)\u0000/g,(m,i)=>'<code>'+esc(code[+i])+'</code>')
    .replace(/\u0000C(\d+)\u0000/g,(m,i)=>'<code>'+esc(code[+i])+'</code>')
    .replace(/\u0000R(\d+)\u0000/g,(m,i)=>xrefBtn(refs[+i][0],refs[+i][1]))
    .replace(/\u0000D\u0000/g,'$');
  const out=[];let para=[],list=null;
  const flushP=()=>{if(para.length){out.push('<p>'+para.map(inline).join('<br>')+'</p>');para=[]}};
  const flushL=()=>{if(list){out.push('<'+list.tag+'>'+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</'+list.tag+'>');list=null}};
  for(const raw of s.split(/\r?\n/)){
    const line=raw.trimEnd();let m;
    if(!line.trim()){flushP();flushL();continue}
    if((m=/^\s*\u0000C(\d+)\u0000$/.exec(line))){flushP();flushL();
      out.push(lang[+m[1]]==='strumento'?toolHTML(code[+m[1]]):'<pre class="codeblock'+(lang[+m[1]]==='text'?' diagram':'')+'"><code>'+esc(code[+m[1]])+'</code></pre>');continue}
    if((m=/^\s*#{1,6}\s+(.*)$/.exec(line))){flushP();flushL();out.push('<div class="mh">'+inline(m[1])+'</div>');continue}
    if((m=/^\s*[-*]\s+(.*)$/.exec(line))){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]}}list.items.push(m[1]);continue}
    if((m=/^\s*\d+[.)]\s+(.*)$/.exec(line))){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]}}list.items.push(m[1]);continue}
    if(list){list.items[list.items.length-1]+=' '+line.trim();continue}
    para.push(line);
  }
  flushP();flushL();
  const html='<div class="md">'+out.join('')+'</div>';
  /* uno strumento cambia a ogni passo: quel testo non si tiene in memoria */
  if(!hasTool){if(mdCache.size>800)mdCache.clear();mdCache.set(src,html)}
  return html;
}
/* testo breve su una riga (opzioni delle domande): solo grassetto e codice in linea */
const mdInline=t=>esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

/* ---------- collegamenti interni e glossario ---------- */
const TERM_TIPI={ufficiale:'Termine ufficiale',uso_comune:'Termine d\'uso comune',semplificazione:'Semplificazione didattica'};
/* trova a cosa punta un id: un argomento, una sua sezione, un termine, una tecnica o un esercizio */
function refFind(id){
  const a0=S.arg.get(id);if(a0)return {k:'arg',a:a0,item:a0};
  for(const a of S.arg.values()){
    if(!id.startsWith(a.id+'.'))continue;
    const secs=sortedSections(a),i=secs.findIndex(s=>s.id===id);
    if(i>=0)return {k:'sez',a,item:secs[i],i,n:secs.length};
    let x=arr(a.termini).find(g=>g&&g.id===id);if(x)return {k:'term',a,item:x};
    x=arr(a.tecniche).find(t=>t&&t.id===id);if(x)return {k:'tec',a,item:x};
    x=arr(a.esercizi).find(t=>t&&t.id===id);if(x)return {k:'ese',a,item:x};
  }
  return null;
}
function refLabel(id){const r=refFind(id);if(!r)return id;
  return r.k==='arg'?r.a.titolo:r.k==='term'?r.item.termine:r.k==='tec'?r.item.nome:r.k==='ese'?'esercizio '+id.split('.').pop():r.item.titolo}
const xrefBtn=(id,t)=>`<button type="button" class="xref${refFind(id)?'':' miss'}" data-act="xref" data-id="${esc(id)}">${esc(t||refLabel(id))}</button>`;
function termHTML(g){
  return `${g.tipo&&TERM_TIPI[g.tipo]?`<div class="chips"><span class="chip acc">${TERM_TIPI[g.tipo]}</span></div>`:''}
    ${arr(g.accezioni).length?`<div class="box"><span class="eyebrow">Significati della parola</span>${md(arr(g.accezioni).map(x=>'- '+String(x).replace(/\n/g,' ')).join('\n'))}</div>`:''}
    ${g.docente?`<div class="box"><span class="eyebrow">Definizione del docente</span>${md(g.docente)}</div>`:''}
    ${g.ufficiale?`<div class="box"><span class="eyebrow">Definizione ufficiale</span>${md(g.ufficiale)}${g.fonte?`<div class="muted small">Fonte: ${esc(g.fonte)}</div>`:''}</div>`:''}
    ${g.nota?`<div style="margin-top:10px">${md(g.nota)}</div>`:''}

/* ---------- strumenti interattivi ----------
   Una raccolta fissa di strumenti scritti qui. Il pacchetto non contiene codice: in un blocco ```strumento
   mette solo dati (JSON) che dicono quale strumento usare e cosa mostrare. Tutti i testi passano da esc() o md(). */
/* icone dei pulsanti degli strumenti (i caratteri ◄ ► ▶ non ci sono nel font dell'app) */
const TIC={l:'<svg class="tic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',r:'<svg class="tic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  play:'<svg class="tic f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg class="tic f" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'};
const TOOL_TIPI={passi:'Passo passo',schema:'Schema da esplorare',domanda:'Mettiti alla prova',collega:'Collega'};
const toolCache=new Map(),toolReg=new Map();
const strHash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
function toolParse(raw){
  if(toolCache.has(raw))return toolCache.get(raw);
  const r=toolCheck(raw);if(toolCache.size>200)toolCache.clear();toolCache.set(raw,r);return r;
}
function toolCheck(raw){
  let t;try{t=JSON.parse(raw)}catch(e){return {err:'il blocco strumento non è JSON valido ('+e.message+')'}}
  if(!t||typeof t!=='object'||Array.isArray(t))return {err:'il blocco strumento deve essere un oggetto JSON'};
  const S_=v=>typeof v==='string'&&v.trim()!=='',SA=v=>Array.isArray(v)&&v.every(x=>typeof x==='string');
  if(!TOOL_TIPI[t.tipo])return {err:`tipo di strumento «${String(t.tipo)}» sconosciuto (possibili: ${Object.keys(TOOL_TIPI).join(', ')})`};
  if(t.id!==undefined&&!(typeof t.id==='string'&&ID_RE.test(t.id)))return {err:'id dello strumento non valido'};
  for(const f of ['titolo','come_si_usa','cosa_osservare'])if(t[f]!==undefined&&typeof t[f]!=='string')return {err:`il campo ${f} deve essere un testo`};
  if((t.tipo==='passi'||t.tipo==='schema')&&!(S_(t.come_si_usa)&&S_(t.cosa_osservare)))return {err:'servono «come_si_usa» e «cosa_osservare»'};
  if(t.tipo==='passi'){
    if(!Array.isArray(t.passi)||!t.passi.length||t.passi.length>300)return {err:'«passi» deve essere un elenco da 1 a 300 passi'};
    if(t.colonne!==undefined&&!SA(t.colonne))return {err:'«colonne» deve essere un elenco di titoli'};
    for(let i=0;i<t.passi.length;i++){const p=t.passi[i];
      if(!p||typeof p!=='object')return {err:`il passo ${i+1} non è un oggetto`};
      if(p.nota!==undefined&&typeof p.nota!=='string')return {err:`passo ${i+1}: «nota» deve essere un testo`};
      if(p.note!==undefined&&!SA(p.note))return {err:`passo ${i+1}: «note» deve essere un elenco di testi`};
      const cols=p.colonne||(p.pannelli?[p.pannelli]:null);
      if(!Array.isArray(cols)||!cols.length||cols.length>3)return {err:`passo ${i+1}: servono «pannelli» oppure «colonne» (da 1 a 3)`};
      for(const c of cols){if(!Array.isArray(c)||c.length>5)return {err:`passo ${i+1}: ogni colonna è un elenco di al massimo 5 pannelli`};
        for(const q of c){if(!q||typeof q!=='object'||!SA(q.righe)||q.righe.length>80)return {err:`passo ${i+1}: ogni pannello ha «righe», un elenco di al massimo 80 testi`};
          if(q.titolo!==undefined&&typeof q.titolo!=='string')return {err:`passo ${i+1}: il titolo di un pannello deve essere un testo`};
          for(const f of ['evidenzia','cambiate'])if(q[f]!==undefined&&!(Array.isArray(q[f])&&q[f].every(n=>Number.isInteger(n))))return {err:`passo ${i+1}: «${f}» deve essere un elenco di numeri di riga (da 0)`}}}
    }
  }
  if(t.tipo==='schema'){
    if(!Array.isArray(t.nodi)||t.nodi.length<2||t.nodi.length>14)return {err:'«nodi» deve avere da 2 a 14 elementi'};
    if(t.nodi.some(n=>!n||!S_(n.etichetta)||!S_(n.dettaglio)||(n.sotto!==undefined&&typeof n.sotto!=='string')))return {err:'ogni nodo ha «etichetta» e «dettaglio» (e facoltativo «sotto»)'};
    if(t.tra!==undefined&&!SA(t.tra))return {err:'«tra» deve essere un elenco di testi'};
  }
  if(t.tipo==='domanda'){
    if(!S_(t.domanda))return {err:'manca «domanda»'};
    if(!Array.isArray(t.opzioni)||t.opzioni.length<2||t.opzioni.length>6)return {err:'«opzioni» deve avere da 2 a 6 elementi'};
    if(t.opzioni.some(o=>!o||!S_(o.testo)||typeof o.giusta!=='boolean'||!S_(o.perche)))return {err:'ogni opzione ha «testo», «giusta» (true o false) e «perche»'};
    if(!t.opzioni.some(o=>o.giusta))return {err:'almeno un\'opzione deve essere giusta'};
  }
  if(t.tipo==='collega'){
    if(!Array.isArray(t.coppie)||t.coppie.length<2||t.coppie.length>10)return {err:'«coppie» deve avere da 2 a 10 elementi'};
    if(t.coppie.some(c=>!c||!S_(c.a)||!S_(c.b)))return {err:'ogni coppia ha «a» e «b»'};
  }
  return {t,key:t.id||('h'+strHash(raw))};
}
/* mescola sempre allo stesso modo per lo stesso strumento (così il disegno non cambia a ogni tocco) */
function seededPerm(n,seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))|0;
  const rnd=()=>{h=(h+0x6D2B79F5)|0;let x=Math.imul(h^h>>>15,1|h);x=x+Math.imul(x^x>>>7,61|x)^x;return ((x^x>>>14)>>>0)/4294967296};
  const p=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
  if(n>1&&p.every((v,i)=>v===i))p.push(p.shift());return p}
function toolHTML(raw){

    const playing=S.play&&S.play.key===key;

      return `<div class="tool-panel">${q.titolo?`<span class="eyebrow">${esc(q.titolo)}</span>`:''}<pre class="tool-pre">${q.righe.map((x,i)=>`<span class="ln${ev.has(i)?' cur':''}${ch.has(i)?' chg':''}">${esc(x)||' '}</span>`).join('')}</pre></div>`};
    body=`<div class="tool-ctrl">${bt('prev',TIC.l+'Indietro','',k?'':' disabled')}<span class="num">Passo ${k+1} di ${n}</span>${bt('next',k<n-1?'Passo successivo'+TIC.r:'Fine','primary',k<n-1?'':' disabled')}
        ${bt('play',playing?TIC.pause+'Pausa':TIC.play+'Riproduci','ghost')}${k?bt('reset','Ricomincia','ghost'):''}</div>
      ${P.nota?`<div class="tool-nota">${md(P.nota)}</div>`:''}
      <div class="tool-cols c${cols.length}">${cols.map((c,ci)=>`<div class="tool-col">${heads[ci]?`<div class="tool-colh">${esc(heads[ci])}</div>`:''}${notes[ci]?`<div class="tool-cnote">${md(notes[ci])}</div>`:''}${c.map(panel).join('')}</div>`).join('')}</div>`;

  if(t.tipo==='schema'){

    body=`<div class="tool-sch-wrap"><div class="tool-schema">${t.nodi.map((nd,i)=>`${i?`<div class="tool-tra">${tra[i-1]?esc(tra[i-1]):'│'}</div>`:''}<button class="tool-node${sel===i?' on':''}" data-act="tool" data-key="${key}" data-op="pick" data-n="${i}" aria-pressed="${sel===i}">${esc(nd.etichetta)}${nd.sotto?`<small>${esc(nd.sotto)}</small>`:''}</button>`).join('')}</div>
      <div class="tool-detail">${sel==null?'<p class="muted" style="margin:0">Tocca un riquadro per vedere i dettagli.</p>':`<span class="eyebrow">${esc(t.nodi[sel].etichetta)}</span>${md(t.nodi[sel].dettaglio)}
        <div class="tool-ctrl" style="margin:8px 0 0">${sel>0?bt('pick',TIC.l+esc(t.nodi[sel-1].etichetta),'small',' data-n="'+(sel-1)+'"'):''}${sel<t.nodi.length-1?bt('pick',esc(t.nodi[sel+1].etichetta)+TIC.r,'small',' data-n="'+(sel+1)+'"'):''}</div>`}</div></div>`;
  }
  if(t.tipo==='domanda'){
    const ch=Number.isInteger(st.k)?st.k:null,tried=new Set(arr(st.tried)),o=ch!=null?t.opzioni[ch]:null;
    body=`${md(t.domanda)}<div class="tool-opts">${t.opzioni.map((op,i)=>`<button class="tool-opt${ch===i?(op.giusta?' ok':' no'):tried.has(i)?' tried':''}" data-act="tool" data-key="${key}" data-op="pick" data-n="${i}">${mdInline(op.testo)}</button>`).join('')}</div>
      ${o?`<div class="box ${o.giusta?'sol':'bad'}"><span class="eyebrow">${o.giusta?'Giusto':'Non proprio'}</span>${md(o.perche)}</div>${o.giusta?'':'<p class="muted small" style="margin:6px 0 0">Prova un\'altra risposta: anche la spiegazione di quelle sbagliate insegna qualcosa.</p>'}`:''}`;
  }

      <div class="tool-match"><div>${t.coppie.map((c,i)=>`<button class="tool-opt${done.has(i)?' ok':sel===i?' sel':''}" data-act="tool" data-key="${key}" data-op="left" data-n="${i}"${done.has(i)?' disabled':''}>${mdInline(c.a)}</button>`).join('')}</div>
      <div>${perm.map(i=>`<button class="tool-opt${done.has(i)?' ok':st.bad===i?' no':''}" data-act="tool" data-key="${key}" data-op="right" data-n="${i}"${done.has(i)?' disabled':''}>${mdInline(t.coppie[i].b)}</button>`).join('')}</div></div>

  }
  return `<div class="tool" data-key="${key}"><div class="tool-h"><span class="eyebrow">${TOOL_TIPI[t.tipo]}</span>${t.titolo?`<b>${esc(t.titolo)}</b>`:''}</div>
    ${t.come_si_usa||t.cosa_osservare?`<div class="tool-help">${t.come_si_usa?`<div><span class="eyebrow">Come si usa</span>${md(t.come_si_usa)}</div>`:''}${t.cosa_osservare?`<div><span class="eyebrow">Cosa osservare</span>${md(t.cosa_osservare)}</div>`:''}</div>`:''}

function stopPlay(){if(S.play){clearInterval(S.play.timer);S.play=null}}
/* dopo un tocco su uno strumento: ridisegna la pagina e, se è aperto, il riquadro di ripasso (senza farlo tornare in cima) */
function rerender(){render();if(!$('#backdrop').hidden&&S.refStack.length){const sh=$('#sheet'),y=sh.scrollTop;sh.innerHTML=refSheetHTML(S.refStack[S.refStack.length-1]);sh.scrollTop=y}}
function toolAct(b){
  const key=b.dataset.key,op=b.dataset.op,t=toolReg.get(key);if(!t)return;
  const st=S.tool[key]=S.tool[key]||{},n=+b.dataset.n;
  if(t.tipo==='passi'){
    const last=t.passi.length-1;
    if(op==='play'){if(S.play&&S.play.key===key){stopPlay();rerender();return}
      stopPlay();if((st.k||0)>=last)st.k=0;
      S.play={key,timer:setInterval(()=>{const s2=S.tool[key];
        if(!document.querySelector(`.tool[data-key="${key}"]`)||(s2.k||0)>=last){stopPlay();rerender();return}
        s2.k=(s2.k||0)+1;rerender()},1800)};rerender();return}
    stopPlay();
    if(op==='next')st.k=Math.min((st.k||0)+1,last);
    if(op==='prev')st.k=Math.max((st.k||0)-1,0);
    if(op==='reset')st.k=0;
  }
  if(t.tipo==='schema'&&op==='pick'&&n>=0&&n<t.nodi.length)st.k=st.k===n&&b.classList.contains('tool-node')?null:n;
  if(t.tipo==='domanda'&&op==='pick'&&n>=0&&n<t.opzioni.length){st.k=n;if(!t.opzioni[n].giusta)st.tried=[...new Set(arr(st.tried).concat(n))]}
  if(t.tipo==='collega'){
    if(op==='reset'){S.tool[key]={};rerender();return}
    if(op==='left'){st.sel=n;st.msg='';st.bad=null}
    if(op==='right'){
      if(!Number.isInteger(st.sel)){st.msg='Prima tocca un elemento a sinistra.';st.bad=null}
      else if(st.sel===n){st.done=[...new Set(arr(st.done).concat(n))];st.msg='Giusto.';st.sel=null;st.bad=null}
      else{st.bad=n;st.msg='Non vanno insieme: riprova.'}
    }
  }
  rerender();
}

/* ---------- IndexedDB ----------
   Archivi separati: esami, argomenti, piano, ripassi, progressi, impostazioni.
   I progressi stanno da soli e sono legati agli ID: un import non li tocca mai. */
let db=null;
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('esami'))d.createObjectStore('esami',{keyPath:'id'});
    if(!d.objectStoreNames.contains('argomenti'))d.createObjectStore('argomenti',{keyPath:'id'}).createIndex('esame_id','esame_id');
    if(!d.objectStoreNames.contains('piano'))d.createObjectStore('piano',{keyPath:'data'});
    if(!d.objectStoreNames.contains('ripassi'))d.createObjectStore('ripassi',{keyPath:'id'});
    if(!d.objectStoreNames.contains('progressi'))d.createObjectStore('progressi',{keyPath:'id'}).createIndex('tipo','tipo');
    if(!d.objectStoreNames.contains('impostazioni'))d.createObjectStore('impostazioni',{keyPath:'k'});
  };
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
})}
function tx(stores,fn){return new Promise((res,rej)=>{
  const t=db.transaction(stores,'readwrite');
  try{fn(t)}catch(e){try{t.abort()}catch(_){}rej(e);return}
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Salvataggio annullato'));
})}
const getAll=store=>reqP(db.transaction(store).objectStore(store).getAll());
const put=(store,val)=>tx([store],t=>t.objectStore(store).put(val));
const del=(store,key)=>tx([store],t=>t.objectStore(store).delete(key));

/* ---------- stato ---------- */
const S={esami:new Map(),arg:new Map(),prog:new Map(),imp:{},
  tab:'adesso',route:{esame:null,arg:null},open:null,tech:{},ex:{},exAns:{},more:new Set(),planPage:false,
  draft:'',checked:null,exportAll:false,
  /* collegamenti (pila del riquadro di ripasso), mappe aperte, ricerca nel glossario, stato degli strumenti interattivi */
  refStack:[],maps:new Set(),glq:'',tool:{},play:null,
  /* contenuti sul sito: elenco letto da contenuti/indice.json; remoteHash vale solo durante un «Aggiorna» */
  remote:{list:[],ts:0,err:'',busy:false},remoteHash:null};
async function loadAll(){
  const [e,a,p,i]=await Promise.all(['esami','argomenti','progressi','impostazioni'].map(getAll));
  S.esami=new Map(e.map(x=>[x.id,x]));S.arg=new Map(a.map(x=>[x.id,x]));
  S.prog=new Map(p.map(x=>[x.id,x]));S.imp=Object.fromEntries(i.map(x=>[x.k,x.v]));
}
async function setImp(k,v){S.imp[k]=v;await put('impostazioni',{k,v})}
const pacchetti=()=>obj(S.imp.pacchetti);
const isRead=id=>S.prog.has('let:'+id);
async function toggleRead(id){
  const key='let:'+id;
  if(S.prog.has(key)){S.prog.delete(key);await del('progressi',key);return false}
  const r={id:key,tipo:'lettura',rif:id,data:todayKey(),ts:Date.now()};
  S.prog.set(key,r);await put('progressi',r);return true;

/* le sezioni restano nell'ordine in cui Claude le ha scritte: sono un percorso, ognuna parte dalla precedente.
   Il livello (intuizione, definizione…) è solo un'etichetta. Prima si riordinavano per livello e il filo si spezzava. */
const sortedSections=a=>arr(a.sezioni);
function examTopics(e){
  return arr(e.programma).map((p,i)=>[p,i]).sort((x,y)=>((+x[0].capitolo||0)-(+y[0].capitolo||0))||((+x[0].ordine||0)-(+y[0].ordine||0))||x[1]-y[1]).map(x=>x[0]);
}
/* Le scelte dell'utente su data, ore, pausa e ordine stanno a parte (impostazioni) e vincono sui valori dei pacchetti:
   un nuovo import di Claude non le cancella. */
const scelte=()=>obj(S.imp.scelte_esami);
const effExam=e=>e&&{...e,...obj(scelte()[e.id])};
const byDate=(a,b)=>String(a.data_esame).localeCompare(String(b.data_esame));
function examsSorted(){
  const all=[...S.esami.values()].map(effExam),ord=arr(S.imp.ordine_esami);
  const rank=e=>{const i=ord.indexOf(e.id);return i<0?1e6:i};
  const act=all.filter(e=>!e.pausa).sort((a,b)=>rank(a)-rank(b)||byDate(a,b));
  return act.concat(all.filter(e=>e.pausa).sort(byDate));
}
const activeExams=()=>examsSorted().filter(e=>!e.pausa);
const weeklyHours=()=>activeExams().reduce((s,e)=>s+(+e.ore_settimanali||0),0);

async function saveScelte(id,v){

  if(Object.keys(v).length)all[id]=v;else delete all[id];
  await setImp('scelte_esami',all);await setImp('scelte_ts',Date.now());
}
