/* ---------- validazione dei pacchetti ---------- */
const ID_RE=/^[a-z0-9][a-z0-9._-]*$/;
function isDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=parseKey(s);return keyOf(d)===s}
function lineOf(s,at){let l=1;for(let i=0;i<at&&i<s.length;i++)if(s[i]==='\n')l++;return l}
function lineText(s,at){const a=s.lastIndexOf('\n',at-1)+1;let b=s.indexOf('\n',at);if(b<0)b=s.length;return s.slice(a,b).trim().slice(0,140)}

/* Trova il punto preciso in cui il JSON non va, perché i messaggi del browser sono diversi da uno all'altro */
function locateJsonError(s){
  let i=0;
  const fail=(code,at)=>{throw {code,at:at==null?i:at}};
  const ws=()=>{while(i<s.length&&' \t\n\r'.includes(s[i]))i++};
  const end=()=>{if(i>=s.length)fail('end')};
  function val(){ws();end();const c=s[i];
    if(c==='{')return objv();if(c==='[')return arrv();if(c==='"')return str();
    if(c==='-'||(c>='0'&&c<='9'))return num();
    for(const w of ['true','false','null'])if(s.startsWith(w,i)){i+=w.length;return}
    if('“”«»'.includes(c))fail('curly');if(c==="'"||c==='‘'||c==='’')fail('single');
    if(c==='}'||c===']')fail('trailing');
    fail('unexpected');}
  function objv(){i++;ws();end();if(s[i]==='}'){i++;return}
    for(;;){ws();end();
      if(s[i]!=='"'){if(s[i]==='}')fail('trailing');if('“”'.includes(s[i]))fail('curly');fail('key')}
      str();ws();end();if(s[i]!==':')fail('colon');i++;val();ws();end();
      if(s[i]===','){i++;continue}if(s[i]==='}'){i++;return}fail('comma')}}
  function arrv(){i++;ws();end();if(s[i]===']'){i++;return}
    for(;;){val();ws();end();if(s[i]===','){i++;continue}if(s[i]===']'){i++;return}fail('comma')}}
  function str(){i++;
    while(i<s.length){const c=s[i];
      if(c==='"'){i++;return}
      if(c==='\\'){const n=s[i+1];if(n===undefined)break;
        if('"\\/bfnrt'.includes(n)){i+=2;continue}
        if(n==='u'&&/^[0-9a-fA-F]{4}$/.test(s.substr(i+2,4))){i+=6;continue}
        fail('escape',i)}
      if(c<' ')fail(c==='\n'?'newline':'control',i);
      i++}
    fail('end')}
  function num(){const m=/^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(s.slice(i,i+40));if(!m)fail('unexpected');i+=m[0].length}
  try{val();ws();if(i<s.length)fail('extra');return null}catch(e){if(e&&e.code)return e;throw e}
}
function jsonErrorText(s,e){
  const L=lineOf(s,e.at),near=lineText(s,e.at),ch=s[e.at]||'';
  const m={
    end:`Il JSON si interrompe alla riga ${L}: forse non l'hai copiato tutto. Ricopia il blocco intero da Claude, fino all'ultima parentesi.`,
    comma:`Alla riga ${L} manca una virgola, oppure c'è un carattere di troppo prima di «${esc(ch)}».`,
    trailing:`Alla riga ${L} c'è una virgola di troppo prima di una parentesi di chiusura.`,
    colon:`Alla riga ${L}, dopo il nome di un campo, mancano i due punti «:».`,
    key:`Alla riga ${L} mi aspettavo il nome di un campo tra virgolette.`,
    curly:`Alla riga ${L} ci sono virgolette tipografiche (“ ”) al posto di quelle dritte ("). Succede se il testo passa da Note o da Word: copialo direttamente da Claude.`,
    single:`Alla riga ${L} c'è un apostrofo al posto delle virgolette doppie (").`,
    escape:`Alla riga ${L} c'è «${esc(s.substr(e.at,2))}»: nel JSON le barre rovesciate di LaTeX vanno scritte doppie, per esempio \\\\lim. Chiedi a Claude di correggerlo.`,
    newline:`Alla riga ${L} un testo va a capo dentro le virgolette: nel JSON l'a capo si scrive \\n. Chiedi a Claude di correggerlo.`,
    control:`Alla riga ${L} c'è un carattere invisibile dentro un testo.`,
    unexpected:`Alla riga ${L} c'è un carattere che non mi aspettavo: «${esc(ch)}».`,
    extra:`Dopo la fine del JSON, alla riga ${L}, c'è altro testo. Copia solo il blocco di codice.`
  }[e.code]||`Il JSON non è valido alla riga ${L}.`;
  return {msg:m,near};
}
function cleanInput(t){
  t=String(t||'').replace(/^﻿/,'').trim();
  const fence=/^```[a-zA-Z]*\s*\n([\s\S]*?)\n?```$/.exec(t);if(fence)t=fence[1].trim();
  const a=t.indexOf('{');if(a>0&&!/^[\[{]/.test(t))t=t.slice(a);
  return t;
}
function parsePackage(text){
  const t=cleanInput(text);
  if(!t)return {errs:['Non hai incollato niente.']};
  if(t[0]!=='{')return {errs:['Non sembra un pacchetto di Claude: deve iniziare con una parentesi graffa «{».']};
  let data;
  try{data=JSON.parse(t)}catch(_){
    const e=locateJsonError(t);
    if(!e)return {errs:['Il JSON non è valido, ma non riesco a capire dove. Ricopialo da Claude.']};
    const r=jsonErrorText(t,e);return {errs:[r.msg],near:r.near};
  }
  return validate(data,new Blob([t]).size);
}

/* Controlla un pacchetto contro lo schema versione 1. Gli errori bloccano; gli avvisi no. */
function validate(p,bytes){
  const errs=[],warns=[];const E=m=>errs.push(m),W=m=>warns.push(m);
  if(!p||typeof p!=='object'||Array.isArray(p))return {errs:['Il pacchetto deve essere un oggetto JSON, tra parentesi graffe.']};
  const isStr=v=>typeof v==='string'&&v.trim()!=='';
  const isNum=v=>typeof v==='number'&&isFinite(v);
  const need=(o,f,where,kind)=>{
    const v=o[f];
    if(v===undefined||v===null||(typeof v==='string'&&!v.trim())){E(`${where} manca il campo ${f}.`);return false}
    if(kind==='str'&&typeof v!=='string'){E(`${where} il campo ${f} dovrebbe essere un testo.`);return false}
    if(kind==='num'&&!isNum(v)){E(`${where} il campo ${f} dovrebbe essere un numero.`);return false}
    if(kind==='arr'&&!Array.isArray(v)){E(`${where} il campo ${f} dovrebbe essere un elenco tra parentesi quadre.`);return false}
    if(kind==='obj'&&(typeof v!=='object'||Array.isArray(v))){E(`${where} il campo ${f} dovrebbe essere un oggetto tra parentesi graffe.`);return false}
    return true};
  const opt=(o,f,where,kind)=>o[f]===undefined||o[f]===null||(kind==='str'&&o[f]==='')||need(o,f,where,kind);
  const strArr=(o,f,where)=>{if(!opt(o,f,where,'arr'))return;arr(o[f]).forEach((x,i)=>{if(typeof x!=='string')E(`${where} l'elemento ${i+1} di ${f} dovrebbe essere un testo.`)})};
  const seen=new Set();
  const idOk=(id,where,prefix)=>{
    if(!isStr(id)){E(`${where} manca il campo id.`);return false}
    if(!ID_RE.test(id)){E(`${where} l'ID «${esc(id)}» non va bene: usa solo lettere minuscole, cifre, punto, trattino e trattino basso.`);return false}
    if(seen.has(id))E(`L'ID ${esc(id)} compare due volte nel pacchetto.`);seen.add(id);
    if(prefix&&!id.startsWith(prefix+'.'))W(`L'ID ${esc(id)} non inizia con ${esc(prefix)}.: lo importo lo stesso.`);
    return true};
  /* campi comuni */
  if(p.schema_version===undefined)E('Manca il campo schema_version (deve valere 1).');
  else if(p.schema_version!==1)E(p.schema_version>1?`Questo pacchetto è per la versione ${esc(p.schema_version)} dello schema, ma l'app conosce solo la 1: va aggiornata l'app.`:'Il campo schema_version deve valere 1.');
  if(!isStr(p.tipo))E('Manca il campo tipo.');
  else if(!TIPI.includes(p.tipo))E(`Il tipo «${esc(p.tipo)}» non esiste. I tipi possibili sono: ${TIPI.join(', ')}.`);
  if(!isStr(p.id_pacchetto))E('Manca il campo id_pacchetto.');
  else if(!ID_RE.test(p.id_pacchetto))E(`L'id_pacchetto «${esc(p.id_pacchetto)}» non va bene: usa solo lettere minuscole, cifre, punto, trattino e trattino basso.`);
  if(!isDate(p.generato_il))E('Il campo generato_il deve essere una data scritta come AAAA-MM-GG.');
  /* il piano di studio riguarda tutti gli esami insieme: lì esame_id non serve */
  if(p.tipo==='piano_studio'&&p.esame_id===undefined){}
  else if(!isStr(p.esame_id))E('Manca il campo esame_id.');
  else if(!ID_RE.test(p.esame_id))E(`L'esame_id «${esc(p.esame_id)}» non va bene: usa solo lettere minuscole, cifre, punto, trattino e trattino basso.`);
  if(p.rimuovi!==undefined){if(!Array.isArray(p.rimuovi))E('Il campo rimuovi dovrebbe essere un elenco di ID.');
    else p.rimuovi.forEach((x,i)=>{if(typeof x!=='string'||!ID_RE.test(x))E(`Nel campo rimuovi, l'elemento ${i+1} non è un ID valido.`)})}
  if(errs.length)return {errs,warns};
  const eid=p.esame_id;

  if(p.tipo==='aggiornamento_piano'||p.tipo==='ripasso')
    return {errs:[`I pacchetti di tipo ${p.tipo} non si usano più: il piano arriva con un pacchetto piano_studio e l'app lo ricalcola da sola.`]};

  /* piano di studio: binari (uno per esame), ognuno con le attività in ordine e i minuti stimati */
  if(p.tipo==='piano_studio'&&need(p,'piano','Nel pacchetto','obj')){
    const P=p.piano,w='Nel piano';
    if(need(P,'minuti_giorno',w,'num')&&!(P.minuti_giorno>=15&&P.minuti_giorno<=480))E('Nel piano minuti_giorno deve essere tra 15 e 480.');
    if(opt(P,'giorni_settimana',w,'arr')&&arr(P.giorni_settimana).some(g=>!Number.isInteger(g)||g<0||g>6))
      E('Nel piano giorni_settimana deve contenere numeri da 0 (domenica) a 6 (sabato).');
    if(opt(P,'liberi',w,'arr'))arr(P.liberi).forEach((d,i)=>{if(!isDate(d))E(`Nel piano il giorno libero ${i+1} non è una data scritta come AAAA-MM-GG.`)});
    opt(P,'messaggio',w,'str');
    if(need(P,'binari',w,'arr')){
      if(!P.binari.length)E('Nel piano non c\'è nessun esame (binari è vuoto).');
      P.binari.forEach((b,i)=>{
        if(!b||typeof b!=='object'){E(`Nel piano il binario ${i+1} non è un oggetto.`);return}
        const wb=isStr(b.id)?`Nel binario ${esc(b.id)}`:`Nel binario ${i+1}`;
        idOk(b.id,wb);opt(b,'titolo',wb,'str');opt(b,'minimo_giorno',wb,'num');
        for(const f of ['dal','entro'])if(b[f]!==undefined&&!isDate(b[f]))E(`${wb} il campo ${f} deve essere una data scritta come AAAA-MM-GG.`);
        if(need(b,'esame_id',wb,'str')&&!S.esami.has(b.esame_id))
          W(`${wb} l'esame ${esc(b.esame_id)} non c'è nell'app: questa parte del piano comparirà quando lo importerai.`);
        if(need(b,'attivita',wb,'arr')){
          if(!b.attivita.length)E(`${wb} non ci sono attività.`);
          b.attivita.forEach((a,j)=>{
            if(!a||typeof a!=='object'){E(`${wb} l'attività ${j+1} non è un oggetto.`);return}
            const wa=isStr(a.id)?`Nell'attività ${esc(a.id)}`:`${wb}, nell'attività ${j+1},`;
            idOk(a.id,wa);need(a,'titolo',wa,'str');opt(a,'rif',wa,'str');opt(a,'cosa',wa,'str');
            if(need(a,'minuti',wa,'num')&&!(a.minuti>0&&a.minuti<=600))E(`${wa} minuti deve essere un numero tra 1 e 600.`);
          });
        }
      });
    }
  }

  if(p.tipo==='nuovo_esame'){
    if(need(p,'esame','Nel pacchetto','obj')){
      const e=p.esame,w="Nell'esame";
      need(e,'nome',w,'str');need(e,'cfu',w,'num');
      if(need(e,'data_esame',w,'str')&&!isDate(e.data_esame))E("Nell'esame il campo data_esame deve essere una data scritta come AAAA-MM-GG.");
      need(e,'ore_settimanali',w,'num');opt(e,'perche_mi_serve',w,'str');
      if(need(e,'programma',w,'arr')){
        if(!e.programma.length)E("Il programma dell'esame è vuoto.");
        e.programma.forEach((t,i)=>{
          if(!t||typeof t!=='object'){E(`Nel programma, la voce ${i+1} non è un oggetto.`);return}
          const ww=isStr(t.id)?`Nel programma, alla voce ${esc(t.id)},`:`Nel programma, alla voce ${i+1},`;
          idOk(t.id,ww,eid);need(t,'titolo',ww,'str');opt(t,'capitolo',ww,'num');opt(t,'ordine',ww,'num');
        });
      }
      /* calendario dell'esame (facoltativo): prove con date e prenotazione, e la lista «Cosa manca per prenotare» */
      if(opt(e,'prove',w,'arr'))arr(e.prove).forEach((x,i)=>{
        if(!x||typeof x!=='object'){E(`Nelle prove, la voce ${i+1} non è un oggetto.`);return}
        const ww=isStr(x.id)?`Nella prova ${esc(x.id)},`:`Nella prova ${i+1},`;
        idOk(x.id,ww,eid);need(x,'nome',ww,'str');opt(x,'modalita',ww,'str');opt(x,'quando',ww,'str');opt(x,'programma',ww,'str');opt(x,'nota',ww,'str');
        if(opt(x,'date',ww,'arr'))arr(x.date).forEach(d=>{if(!isDate(d))E(`${ww} la data «${esc(d)}» deve essere scritta come AAAA-MM-GG.`)});
        if(!arr(x.date).length&&!isStr(x.quando))E(`${ww} servono le date oppure il campo quando.`);
        if(x.prenotazione!==undefined&&opt(x,'prenotazione',ww,'obj'))for(const f of ['dal','al'])if(!isDate(obj(x.prenotazione)[f]))E(`${ww} prenotazione.${f} deve essere una data scritta come AAAA-MM-GG.`);
      });
      if(opt(e,'requisiti',w,'arr'))arr(e.requisiti).forEach((x,i)=>{
        if(!x||typeof x!=='object'){E(`Nei requisiti, la voce ${i+1} non è un oggetto.`);return}
        const ww=isStr(x.id)?`Nel requisito ${esc(x.id)},`:`Nel requisito ${i+1},`;
        idOk(x.id,ww,eid);need(x,'testo',ww,'str');opt(x,'valore',ww,'str');
        if(x.fatto!==undefined&&typeof x.fatto!=='boolean')E(`${ww} il campo fatto deve valere true o false.`);
      });
      /* capitoli (v18): i titoli che separano gli argomenti nella pagina dell'esame */
      if(opt(e,'capitoli',w,'arr'))arr(e.capitoli).forEach((x,i)=>{
        if(!x||typeof x!=='object'){E(`Nei capitoli, la voce ${i+1} non è un oggetto.`);return}
        const ww=`Nel capitolo ${i+1},`;need(x,'numero',ww,'num');need(x,'titolo',ww,'str');opt(x,'nota',ww,'str');
      });
    }
  }

  if(p.tipo==='contenuti'){
    if(!S.esami.has(eid))E(`Prima importa il pacchetto dell'esame ${esc(eid)} (tipo nuovo_esame): questi contenuti appartengono a un esame che l'app non conosce ancora.`);
    if(need(p,'argomenti','Nel pacchetto','arr')){
      if(!p.argomenti.length&&!arr(p.simulazioni).length)E("L'elenco argomenti è vuoto.");
      p.argomenti.forEach((a,i)=>{
        if(!a||typeof a!=='object'){E(`L'argomento ${i+1} non è un oggetto.`);return}
        const wa=isStr(a.id)?`Nell'argomento ${esc(a.id)}`:`Nell'argomento ${i+1}`;
        idOk(a.id,wa,eid);need(a,'titolo',wa,'str');opt(a,'fonte',wa,'str');strArr(a,'incerto',wa);opt(a,'prossimo_passo',wa,'str');
        const tid=isStr(a.id)?a.id:null;
        /* mappa, «Prima di iniziare ti servono» e glossario (facoltativi) */
        opt(a,'mappa',wa,'str');
        if(opt(a,'prerequisiti',wa,'arr'))arr(a.prerequisiti).forEach((q,j)=>{const w=`${wa}, nel prerequisito ${j+1},`;
          if(!q||typeof q!=='object'||Array.isArray(q)){E(`${w} serve un oggetto con rif e perche.`);return}
          if(need(q,'rif',w,'str')&&!ID_RE.test(q.rif))E(`${w} rif non è un ID valido.`);opt(q,'perche',w,'str');opt(q,'testo',w,'str')});
        if(opt(a,'termini',wa,'arr'))arr(a.termini).forEach((g,j)=>{
          if(!g||typeof g!=='object'){E(`${wa}, il termine ${j+1} non è un oggetto.`);return}
          const w=isStr(g.id)?`Nel termine ${esc(g.id)}`:`${wa}, nel termine ${j+1},`;
          idOk(g.id,w,tid);need(g,'termine',w,'str');['inglese','docente','ufficiale','fonte','nota'].forEach(f=>opt(g,f,w,'str'));strArr(g,'accezioni',w);
          if(opt(g,'spiegato_in',w,'str')&&isStr(g.spiegato_in)&&!ID_RE.test(g.spiegato_in))E(`${w} spiegato_in non è un ID valido.`);
          if(g.tipo!==undefined&&!TERM_TIPI[g.tipo])W(`${w} il tipo «${esc(g.tipo)}» non lo conosco (ufficiale, uso_comune, semplificazione): lo ignoro.`);
          if(!isStr(g.docente)&&!isStr(g.ufficiale))W(`${w} non c'è nessuna definizione (né del docente né ufficiale).`);
          if(isStr(g.ufficiale)&&!isStr(g.fonte))W(`${w} la definizione ufficiale non dice la fonte.`);
        });
        if(opt(a,'sezioni',wa,'arr'))arr(a.sezioni).forEach((s,j)=>{
          if(!s||typeof s!=='object'){E(`${wa}, la sezione ${j+1} non è un oggetto.`);return}
          const w=isStr(s.id)?`Nella sezione ${esc(s.id)}`:`${wa}, nella sezione ${j+1},`;
          idOk(s.id,w,tid);need(s,'titolo',w,'str');need(s,'testo',w,'str');
          if(need(s,'livello',w,'str')&&!LEVELS[s.livello])E(`${w} il livello «${esc(s.livello)}» non esiste. Quelli possibili: ${LVL_ORDER.join(', ')}.`);
        });
        if(opt(a,'tecniche',wa,'arr'))arr(a.tecniche).forEach((t,j)=>{
          if(!t||typeof t!=='object'){E(`${wa}, la tecnica ${j+1} non è un oggetto.`);return}
          const w=isStr(t.id)?`Nella tecnica ${esc(t.id)}`:`${wa}, nella tecnica ${j+1},`;
          idOk(t.id,w,tid);need(t,'nome',w,'str');opt(t,'quando',w,'str');
          if(opt(t,'esempio',w,'obj')&&t.esempio){opt(t.esempio,'testo',w+', nell\'esempio,','str');strArr(t.esempio,'passi',w+', nell\'esempio,')}
        });
        if(opt(a,'esercizi',wa,'arr'))arr(a.esercizi).forEach((x,j)=>{
          if(!x||typeof x!=='object'){E(`${wa}, l'esercizio ${j+1} non è un oggetto.`);return}
          const w=isStr(x.id)?`Nell'esercizio ${esc(x.id)}`:`${wa}, nell'esercizio ${j+1},`;
          idOk(x.id,w,tid);need(x,'testo',w,'str');need(x,'soluzione',w,'str');opt(x,'suggerimento',w,'str');strArr(x,'passi',w);
          if(need(x,'livello',w,'str')&&!EX_LEVELS[x.livello])E(`${w} il livello «${esc(x.livello)}» non esiste. Quelli possibili: base, medio, difficile.`);
          /* risposta: le caselle che l'app controlla (v17) */
          if(opt(x,'risposta',w,'obj')&&x.risposta&&need(x.risposta,'caselle',w+', nella risposta,','arr')){
            if(!x.risposta.caselle.length)E(`${w} la risposta non ha nessuna casella.`);
            x.risposta.caselle.forEach((c,i)=>{const wc=`${w}, nella casella ${i+1},`;
              if(!c||typeof c!=='object'){E(`${wc} c'è qualcosa che non è un oggetto.`);return}
              opt(c,'etichetta',wc,'str');opt(c,'formato',wc,'str');opt(c,'tolleranza',wc,'num');
              if(need(c,'tipo',wc,'str')&&!ANS_TIPI.includes(c.tipo))E(`${wc} il tipo «${esc(c.tipo)}» non esiste. Quelli possibili: ${ANS_TIPI.join(', ')}.`);
              if(c.tipo==='scelta'&&need(c,'opzioni',wc,'arr')){if(c.opzioni.length<2)E(`${wc} servono almeno 2 opzioni.`);strArr(c,'opzioni',wc)}
              if(need(c,'accettate',wc,'arr')){if(!c.accettate.length)E(`${wc} l'elenco accettate è vuoto.`);
                c.accettate.forEach(v=>{
                  if(c.tipo==='numero'?!isFinite(ansNum(v)):typeof v!=='string')E(`${wc} il valore accettato «${esc(v)}» non va bene per il tipo ${esc(c.tipo)}.`);
                  else if(c.tipo==='scelta'&&!arr(c.opzioni).includes(v))E(`${wc} «${esc(v)}» non è tra le opzioni.`)})}
              if(opt(c,'errori',wc,'obj'))for(const k in obj(c.errori))if(typeof c.errori[k]!=='string')E(`${wc} il messaggio per «${esc(k)}» dovrebbe essere un testo.`);
            });
          }
          /* dopo_sezione: l'esercizio compare anche subito dopo quella sezione («Mettiti alla prova») */
          if(opt(x,'dopo_sezione',w,'str')&&isStr(x.dopo_sezione)&&!arr(a.sezioni).some(s=>s&&s.id===x.dopo_sezione))
            W(`${w} il campo dopo_sezione indica ${esc(x.dopo_sezione)}, che non è una sezione di questo argomento: l'esercizio resta solo in fondo.`);
        });
        if(opt(a,'verifica',wa,'obj')&&a.verifica){
          strArr(a.verifica,'spiegalo',wa+', nella verifica,');
          if(opt(a.verifica,'quiz',wa+', nella verifica,','arr'))arr(a.verifica.quiz).forEach((q,j)=>{
            if(!q||typeof q!=='object'){E(`${wa}, la domanda di quiz ${j+1} non è un oggetto.`);return}
            const w=isStr(q.id)?`Nel quiz ${esc(q.id)}`:`${wa}, nella domanda di quiz ${j+1},`;
            idOk(q.id,w,tid);need(q,'domanda',w,'str');opt(q,'spiegazione',w,'str');
            if(need(q,'opzioni',w,'arr')){if(q.opzioni.length<2)E(`${w} servono almeno 2 opzioni.`);strArr(q,'opzioni',w)}
            if(need(q,'corretta',w,'num')&&Array.isArray(q.opzioni)&&!(Number.isInteger(q.corretta)&&q.corretta>=0&&q.corretta<q.opzioni.length))
              E(`${w} il campo corretta deve essere il numero di un'opzione, contando da 0 (qui da 0 a ${q.opzioni.length-1}).`);
          });
        }
      });
    }
    if(opt(p,'simulazioni','Nel pacchetto','arr'))arr(p.simulazioni).forEach((m,j)=>{
      if(!m||typeof m!=='object'){E(`La simulazione ${j+1} non è un oggetto.`);return}
      const w=isStr(m.id)?`Nella simulazione ${esc(m.id)}`:`Nella simulazione ${j+1}`;
      idOk(m.id,w,eid);need(m,'titolo',w,'str');need(m,'durata_min',w,'num');opt(m,'istruzioni',w,'str');
      if(need(m,'esercizi',w,'arr'))strArr(m,'esercizi',w);
    });
  }
  /* barre rovesciate singole che il JSON accetta ma che rompono le formule (\frac diventa un carattere invisibile) */
  walkStrings(p,(s,where)=>{
    s=stripCode(s);
    const bad=/[\b\f\t\v]/.exec(s);
    const hint={'\b':'\\\\beta','\f':'\\\\frac','\t':'\\\\theta o \\\\to','\v':'\\\\varepsilon'};
    if(bad){E(`${where} c'è una barra rovesciata singola (forse ${hint[bad[0]]} scritto con una sola barra). Nel JSON le barre di LaTeX vanno doppie: chiedi a Claude di correggerlo.`);return}
    const inMath=s.match(/\$[^$]*\$/g)||[];
    if(inMath.some(x=>/[\n\r]/.test(x)))E(`${where} una formula va a capo: probabilmente c'è \\\\neq, \\\\nabla o \\\\rightarrow con una sola barra. Chiedi a Claude di correggerlo.`);
  });
  /* strumenti interattivi (blocchi ```strumento) e collegamenti [[id]] */
  if(!errs.length){
    const known=id=>seen.has(id)||!!refFind(id);
    walkStrings(p,(s,where)=>{
      for(const m of String(s).replace(/\r\n?/g,'\n').matchAll(CODE_BLOCK))
        if(m[1].trim().toLowerCase()==='strumento'){const r=toolCheck(m[2]);if(r.err)E(`${where} uno strumento interattivo non va: ${esc(r.err)}.`)}
      for(const m of stripCode(s).matchAll(XREF))
        if(!known(m[1]))W(`${where} c'è un collegamento a ${esc(m[1])}, che non trovo: lo mostro lo stesso, e funzionerà quando importerai quel contenuto.`);
    });
    if(p.tipo==='contenuti')for(const a of arr(p.argomenti)){
      for(const q of arr(a&&a.prerequisiti))if(q&&isStr(q.rif)&&ID_RE.test(q.rif)&&!known(q.rif))W(`In ${esc(a.id)} il prerequisito ${esc(q.rif)} non lo trovo: lo mostro lo stesso.`);
      for(const g of arr(a&&a.termini))if(g&&isStr(g.spiegato_in)&&ID_RE.test(g.spiegato_in)&&!known(g.spiegato_in))W(`Nel termine ${esc(g.id)} spiegato_in indica ${esc(g.spiegato_in)}, che non trovo.`);
    }
  }
  if(bytes>MAX_KB*1024)W(`Il pacchetto è grande (${fmtBytes(bytes)}): lo importo, ma la prossima volta chiedi a Claude di dividerlo in parti più piccole.`);
  return {errs:dedupe(errs),warns:dedupe(warns),data:errs.length?null:p};
}
const dedupe=a=>[...new Set(a)];
function walkStrings(o,fn,where){
  where=where||'Nel pacchetto';
  if(typeof o==='string'){fn(o,where);return}
  if(Array.isArray(o)){o.forEach(x=>walkStrings(x,fn,where));return}
  if(o&&typeof o==='object'){
    const w=typeof o.id==='string'&&ID_RE.test(o.id)?'In '+esc(o.id):where;
    for(const k in o)walkStrings(o[k],fn,w);
  }
}

/* ---------- fusione per ID e anteprima ---------- */
function mergeById(oldA,newA){const out=arr(oldA).slice();for(const n of arr(newA)){const i=out.findIndex(o=>o.id===n.id);if(i>=0)out[i]=n;else out.push(n)}return out}
function normTopic(a,eid){return {id:a.id,esame_id:eid,titolo:a.titolo,fonte:a.fonte||'',incerto:arr(a.incerto),prossimo_passo:a.prossimo_passo||'',
  mappa:a.mappa||'',prerequisiti:arr(a.prerequisiti),termini:arr(a.termini),
  sezioni:arr(a.sezioni),tecniche:arr(a.tecniche),esercizi:arr(a.esercizi),verifica:{spiegalo:arr(obj(a.verifica).spiegalo),quiz:arr(obj(a.verifica).quiz)}}}
function mergeTopic(old,a,eid){
  const n=normTopic(a,eid),v=obj(a.verifica);
  return {...old,esame_id:eid,titolo:a.titolo,
    fonte:'fonte' in a?n.fonte:old.fonte,incerto:'incerto' in a?n.incerto:arr(old.incerto),
    prossimo_passo:'prossimo_passo' in a?n.prossimo_passo:old.prossimo_passo,
    mappa:'mappa' in a?n.mappa:(old.mappa||''),prerequisiti:'prerequisiti' in a?n.prerequisiti:arr(old.prerequisiti),
    termini:mergeById(old.termini,n.termini),
    sezioni:mergeById(old.sezioni,n.sezioni),tecniche:mergeById(old.tecniche,n.tecniche),esercizi:mergeById(old.esercizi,n.esercizi),
    verifica:{spiegalo:'spiegalo' in v?n.verifica.spiegalo:arr(obj(old.verifica).spiegalo),quiz:mergeById(obj(old.verifica).quiz,n.verifica.quiz)}};
}
function buildPlan(p){
  const esami=new Map([...S.esami].map(([k,v])=>[k,clone(v)]));
  const arg=new Map([...S.arg].map(([k,v])=>[k,clone(v)]));
  const tE=new Set(),tA=new Set(),dE=new Set(),dA=new Set(),warns=[],lines=[];
  /* 1. rimuovi */
  let removed=0,missing=0;
  for(const id of arr(p.rimuovi)){
    let found=false;
    if(esami.has(id)){esami.delete(id);dE.add(id);tE.delete(id);found=true;
      for(const [k,a] of arg)if(a.esame_id===id){arg.delete(k);dA.add(k);tA.delete(k)}}
    if(arg.has(id)){arg.delete(id);dA.add(id);tA.delete(id);found=true}
    for(const [k,e] of esami){
      const n1=arr(e.programma).length,n2=arr(e.simulazioni).length;
      e.programma=arr(e.programma).filter(x=>x.id!==id);e.simulazioni=arr(e.simulazioni).filter(x=>x.id!==id);
      if(e.programma.length!==n1||e.simulazioni.length!==n2){tE.add(k);found=true}}
    for(const [k,a] of arg){
      let ch=false;
      for(const f of ['sezioni','tecniche','esercizi','termini']){const n=arr(a[f]).length;a[f]=arr(a[f]).filter(x=>x.id!==id);if(a[f].length!==n)ch=true}
      const v=obj(a.verifica),n=arr(v.quiz).length;a.verifica={spiegalo:arr(v.spiegalo),quiz:arr(v.quiz).filter(x=>x.id!==id)};
      if(a.verifica.quiz.length!==n)ch=true;
      if(ch){tA.add(k);found=true}}
    if(found)removed++;else missing++;
  }
  /* una riga sola: di solito vuol dire che la versione vecchia non era mai stata importata, e va bene così */
  if(missing)warns.push(removed?`${pl(missing,'parte vecchia','parti vecchie')} da togliere non ${missing===1?'c\'era':'c\'erano'}: va bene così.`
    :'Non avevi la versione vecchia di questi argomenti: non c\'è niente da togliere, va bene così.');
  /* 2. aggiungi o sostituisci */
  if(p.tipo==='nuovo_esame'){
    const n=p.esame,old=esami.get(p.esame_id);
    esami.set(p.esame_id,{id:p.esame_id,nome:n.nome,cfu:n.cfu,data_esame:n.data_esame,ore_settimanali:n.ore_settimanali,
      perche_mi_serve:n.perche_mi_serve||(old&&old.perche_mi_serve)||'',programma:mergeById(old&&old.programma,n.programma),simulazioni:arr(old&&old.simulazioni),
      prove:n.prove!==undefined?arr(n.prove):arr(old&&old.prove),requisiti:n.requisiti!==undefined?arr(n.requisiti):arr(old&&old.requisiti),
      capitoli:n.capitoli!==undefined?arr(n.capitoli):arr(old&&old.capitoli)});
    tE.add(p.esame_id);
    const mine=obj(scelte()[p.esame_id]),kept=[];
    if('data_esame' in mine)kept.push('la data ('+esc(shortDate(mine.data_esame))+')');
    if('ore_settimanali' in mine)kept.push('le ore ('+fmtH(mine.ore_settimanali)+' a settimana)');
    if(kept.length)warns.push(`Per questo esame hai scelto tu ${listIt(kept)}: tengo le tue. Puoi cambiarle da Esami → Modifica.`);
    lines.push(`${old?'Aggiorno':'Aggiungo'} l'esame <b>${esc(n.nome)}</b> (${esc(n.cfu)} CFU, esame il ${esc(shortDate(n.data_esame))}) con ${pl(n.programma.length,'argomento','argomenti')} nel programma.`);
  }
  if(p.tipo==='contenuti'){
    const e=esami.get(p.esame_id);
    let nNew=0,nUpd=0,cs=0,ct=0,ce=0,cq=0,cg=0;const titles=[];
    for(const a of arr(p.argomenti)){
      const old=arg.get(a.id);
      arg.set(a.id,old?mergeTopic(old,a,p.esame_id):normTopic(a,p.esame_id));tA.add(a.id);
      if(old)nUpd++;else{nNew++;titles.push(a.titolo)}
      cs+=arr(a.sezioni).length;ct+=arr(a.tecniche).length;ce+=arr(a.esercizi).length;cq+=arr(obj(a.verifica).quiz).length;cg+=arr(a.termini).length;
      if(e&&!arr(e.programma).some(x=>x.id===a.id)){
        e.programma=arr(e.programma).concat([{id:a.id,titolo:a.titolo,capitolo:999,ordine:999}]);tE.add(e.id);
        warns.push(`L'argomento ${esc(a.id)} non è nel programma dell'esame: lo aggiungo in fondo.`);
      }
    }
    const sims=arr(p.simulazioni);
    if(e&&sims.length){
      e.simulazioni=mergeById(e.simulazioni,sims);tE.add(e.id);
      const known=new Set();for(const a of arg.values())if(a.esame_id===e.id)arr(a.esercizi).forEach(x=>known.add(x.id));
      for(const m of sims)for(const x of arr(m.esercizi))if(!known.has(x))warns.push(`La simulazione ${esc(m.id)} usa l'esercizio ${esc(x)}, che non trovo: quando lo importerai comparirà.`);
    }
    const parts=[];
    if(nNew)parts.push(pl(nNew,'argomento','argomenti')+' ('+titles.slice(0,3).map(esc).join(', ')+(titles.length>3?'…':'')+')');
    if(cs)parts.push(pl(cs,'sezione','sezioni'));if(ct)parts.push(pl(ct,'tecnica','tecniche'));
    if(ce)parts.push(pl(ce,'esercizio','esercizi'));if(cq)parts.push(pl(cq,'quiz','quiz'));
    if(cg)parts.push(pl(cg,'termine del glossario','termini del glossario'));
    if(sims.length)parts.push(pl(sims.length,'simulazione','simulazioni'));
    if(parts.length)lines.push((nNew?'Aggiungo ':'Aggiungo o sostituisco ')+listIt(parts)+'.');
    if(nUpd)lines.push(`Aggiorno ${pl(nUpd,'argomento già presente','argomenti già presenti')}: le parti con lo stesso ID vengono sostituite, le altre restano.`);
  }
  let piano=null;
  if(p.tipo==='piano_studio'){
    const P=p.piano,bs=arr(P.binari);
    const names=bs.map(b=>{const e=esami.get(b.esame_id);return '<b>'+esc(e?e.nome:b.esame_id)+'</b>'});
    const na=bs.reduce((s,b)=>s+arr(b.attivita).length,0),min=bs.reduce((s,b)=>s+arr(b.attivita).reduce((x,a)=>x+(+a.minuti||0),0),0);
    lines.push(`${S.imp.piano_studio?'Sostituisco':'Aggiungo'} il piano di studio: ${listIt(names)}, ${pl(na,'attività','attività')} (circa ${fmtH(min/60)} ore), ${esc(P.minuti_giorno)} minuti al giorno. Quello che hai già fatto resta.`);
    if(+S.imp.piano_minuti>=15)warns.push(`Hai scelto tu ${esc(S.imp.piano_minuti)} minuti al giorno: tengo i tuoi.`);
    piano={...P,id_pacchetto:p.id_pacchetto,generato_il:p.generato_il};
  }
  if(removed)lines.push(`Tolgo ${pl(removed,'elemento','elementi')} indicati da Claude.`);
  const prev=pacchetti()[p.id_pacchetto];
  return {p,lines,warns,prev,piano,
    putE:[...tE].map(k=>esami.get(k)).filter(Boolean),putA:[...tA].map(k=>arg.get(k)).filter(Boolean),delE:[...dE],delA:[...dA],esami,arg};
}
async function applyPlan(plan){
  /* se arriva dal sito, si salva anche l'impronta: così l'app sa che questa versione c'è già */
  const h=S.remoteHash&&S.remoteHash[plan.p.id_pacchetto];
  const pk={...pacchetti(),[plan.p.id_pacchetto]:{tipo:plan.p.tipo,esame_id:plan.p.esame_id,generato_il:plan.p.generato_il,importato_il:todayKey(),...(h?{hash:h}:{})}};
  await tx(['esami','argomenti','impostazioni'],t=>{
    const se=t.objectStore('esami'),sa=t.objectStore('argomenti');
    plan.delE.forEach(k=>se.delete(k));plan.delA.forEach(k=>sa.delete(k));
    plan.putE.forEach(v=>se.put(v));plan.putA.forEach(v=>sa.put(v));
    t.objectStore('impostazioni').put({k:'pacchetti',v:pk});
    if(plan.piano)t.objectStore('impostazioni').put({k:'piano_studio',v:plan.piano});
  });
  S.esami=plan.esami;S.arg=plan.arg;S.imp.pacchetti=pk;mdCache.clear();
  if(plan.piano)S.imp.piano_studio=plan.piano;
}

/* ---------- contenuti dal sito ----------
   Claude mette i pacchetti nella cartella contenuti/ del sito dell'app, con un elenco (indice.json)
   che per ogni pacchetto ha un'impronta. L'app confronta le impronte con quelle salvate all'import
   e propone «Aggiorna». Legge solo file del suo stesso sito: niente account, password o chiavi.
   I progressi non escono mai dal dispositivo. */
const REMOTE='contenuti/';
const SAFE_FILE=/^[a-z0-9][a-z0-9-]*(\/[a-z0-9][a-z0-9-]*)*\.json$/, SAFE_HASH=/^[0-9a-f]{8,64}$/;
async function checkRemote(){
  if(S.remote.busy)return;S.remote.busy=true;
  try{
    const r=await fetch(REMOTE+'indice.json',{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const ix=obj(await r.json());
    const list=arr(ix.pacchetti).filter(v=>v&&SAFE_FILE.test(String(v.file))&&SAFE_HASH.test(String(v.hash))&&typeof v.id_pacchetto==='string'&&v.id_pacchetto);
    S.remote={list,ts:Date.now(),err:'',busy:false};
  }catch(e){S.remote={...S.remote,ts:Date.now(),err:navigator.onLine===false?'offline':'errore',busy:false}}
}
/* i pacchetti del sito non ancora importati, o importati in una versione diversa */
function remotePending(){const pk=pacchetti();return arr(S.remote.list).filter(v=>!pk[v.id_pacchetto]||pk[v.id_pacchetto].hash!==v.hash)}
function remoteStatus(){
  const n=remotePending().length,r=S.remote;
  if(!r.ts)return 'Controllo se ci sono novità…';
  if(r.err==='offline')return 'Sei senza internet: controllo quando torni in rete.';
  if(r.err)return 'Non riesco a leggere l\'elenco dei contenuti. Riprova tra poco.';
  const ora=new Date(r.ts),hh=pad(ora.getHours())+':'+pad(ora.getMinutes());
  return n?`${pl(n,'pacchetto nuovo o corretto','pacchetti nuovi o corretti')} da Claude.`:`Tutto aggiornato: hai tutti i ${r.list.length} pacchetti. Controllato alle ${hh}.`;
}
function updCard(){
  const todo=remotePending();if(!todo.length)return '';
  const names=[...new Set(todo.map(v=>{const e=S.esami.get(v.esame_id);return e?e.nome:''}).filter(Boolean))];
  return `<section class="card upd stack-s"><div class="eyebrow">Novità da Claude</div>
    <div><b>${pl(todo.length,'pacchetto nuovo','pacchetti nuovi')}</b>${names.length?' per '+esc(listIt(names)):''}. Li scarico e ti mostro cosa cambia prima di importarli.</div>
    <button class="btn primary big" data-act="remote-update">Aggiorna</button></section>`;
}

/* ---------- calendario dell'esame ----------
   Le date le porta Claude nel pacchetto nuovo_esame (prove, requisiti); l'app conta solo i giorni.
   Le spunte dei requisiti sono dell'utente e restano sul dispositivo (impostazioni.requisiti_spunte). */
const spunte=()=>obj(S.imp.requisiti_spunte);
const reqKey=(eid,rid)=>eid+'|'+rid;
const reqDone=(eid,r)=>!!r.fatto||!!spunte()[reqKey(eid,r.id)];
const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1);
function bookText(pr){const b=obj(pr.prenotazione);if(!isDate(b.dal)||!isDate(b.al))return null;const t=todayKey();
  if(t<b.dal)return {cls:'wait',txt:`la prenotazione si apre ${dayDate(b.dal)} (${untilText(b.dal)})`};
  if(t<=b.al)return {cls:'open',txt:`prenotazione aperta fino a ${dayDate(b.al)}`+(diffDays(t,b.al)<=3?` (${untilText(b.al)})`:'')};
  return {cls:'closed',txt:'prenotazione chiusa'}}
/* la prossima prova con una data non ancora passata, tra tutti gli esami in corso */
function nextDeadline(){let best=null;
  for(const e of activeExams())for(const pr of arr(e.prove)){const d=arr(pr.date).filter(isDate).find(x=>x>=todayKey());
    if(d&&(!best||d<best.d))best={e,pr,d}}
  return best}
function deadlineCard(){const n=nextDeadline();if(!n)return '';const b=bookText(n.pr);
  return `<button class="card deadline" data-act="goto-exam" data-id="${esc(n.e.id)}"><span class="eyebrow">Prossima scadenza</span>
    <span class="dl-what">${esc(n.e.nome)}: ${esc(n.pr.nome.charAt(0).toLowerCase()+n.pr.nome.slice(1))}${n.pr.modalita?' · '+esc(n.pr.modalita):''} · ${esc(dayDate(n.d))} <span class="muted">(${untilText(n.d)})</span></span>
    ${b?`<span class="dl-book ${b.cls}">${esc(cap1(b.txt))}.</span>`:''}</button>`}

/* ---------- piano di studio (dal 12 novembre 2026, v16) ----------
   Claude decide COSA fare: per ogni esame un «binario» con le attività in ordine e i minuti stimati (pacchetto piano_studio).
   L'app fa solo i conti, ogni volta che si apre o che segni qualcosa:
   - prende quello che resta di ogni attività (dalle sezioni lette o dalla spunta «Fatto»);
   - riempie i giorni di studio (minuti al giorno, lun–ven, senza i giorni liberi) partendo dall'esame più vicino;
     un binario con minimo_giorno riceve comunque quei minuti (es. un po' di Programmazione mentre si prepara Sicurezza);
   - un binario finisce il giorno prima dell'esame (o alla data «entro»).
   Così il piano si ricalcola da solo: se fai di più si va avanti, se salti un giorno il resto scivola sui giorni dopo.
   Oggi si calcola da com'era stamattina: quello che fai oggi resta in lista, spuntato, invece di sparire. */
const pianoS=()=>{const p=S.imp.piano_studio;return p&&arr(p.binari).length?p:null};
const pianoMin=P=>{const m=+S.imp.piano_minuti;return m>=15?m:(+P.minuti_giorno||90)};
const studyDays=P=>arr(P.giorni_settimana).length?P.giorni_settimana:[1,2,3,4,5];
const isStudyDay=(k,P)=>studyDays(P).includes(parseKey(k).getDay())&&!arr(P.liberi).includes(k);
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'')};
const r5=m=>m<=0.5?0:Math.max(5,Math.round(m/5)*5);
const attMin=a=>+a.minuti||0;
const attTopic=a=>{const t=a.rif&&S.arg.get(a.rif);return t&&arr(t.sezioni).length?t:null};
/* quanto è fatto di un'attività (0…1); con «before» conta solo quello fatto prima di quel giorno */
function attFrac(a,before){
  const r=S.prog.get('att:'+a.id);if(r&&(!before||r.data<before))return 1;
  const t=attTopic(a);if(!t)return 0;
  let n=0;for(const s of t.sezioni){const x=S.prog.get('let:'+s.id);if(x&&(!before||x.data<before))n++}
  return n/t.sezioni.length;
}
function planTracks(P,remOf){
  const out=[],today=todayKey();
  arr(P.binari).forEach((b,i)=>{
    const e0=S.esami.get(b.esame_id),e=e0&&effExam(e0);
    if(!e||e.pausa)return;
    const entro=isDate(b.entro)?b.entro:isDate(e.data_esame)?addDays(e.data_esame,-1):null;
    if(!entro||entro<today)return;
    out.push({b,e,entro,dal:isDate(b.dal)?b.dal:'',minimo:+b.minimo_giorno||0,ord:i,items:arr(b.attivita).map(a=>({a,r:remOf(a)}))});
  });
  return out;
}
const trackLeft=t=>t.items.reduce((s,it)=>s+it.r,0);
/* riempie al massimo «budget» minuti con le attività del binario, nell'ordine */
function fillTrack(t,budget,out,cap){
  let used=0;
  for(const it of t.items){
    if(it.r<=0)continue;
    /* un'attività corta da spuntare (senza contenuti nell'app, es. una lezione sulla dispensa) non si spezza:
       se oggi non ci sta, si fa il giorno dopo e il tempo che avanza va all'esame successivo */
    if(!attTopic(it.a)&&attMin(it.a)<=45&&it.r>budget-used+10&&it.r<=cap)break;
    let give=Math.min(it.r,budget-used);
    if(it.r-give>0&&it.r-give<10)give=it.r;/* niente avanzi da 5 minuti per il giorno dopo */
    if(give<10&&give<it.r)break;/* e niente pezzetti troppo corti: si comincia il giorno dopo */
    it.r-=give;used+=give;out.push({t,a:it.a,min:give,fine:it.r<=0});
    if(used>=budget)break;
  }
  return used;
}
function planDay(tracks,k,cap){
  const out=[];
  const act=tracks.filter(t=>k<=t.entro&&(!t.dal||k>=t.dal)&&trackLeft(t)>0).sort((x,y)=>x.entro.localeCompare(y.entro)||x.ord-y.ord);
  let left=cap;
  act.forEach((t,i)=>{if(i&&t.minimo>0&&left>=10)left-=fillTrack(t,Math.min(t.minimo,left),out,cap)});
  for(const t of act){if(left<10)break;left-=fillTrack(t,left,out,cap)}
  const m=new Map();
  for(const x of out){const o=m.get(x.a.id);if(o){o.min+=x.min;o.fine=x.fine}else m.set(x.a.id,{...x})}
  return [...m.values()].sort((x,y)=>act.indexOf(x.t)-act.indexOf(y.t));
}
function planState(){
  const P=pianoS();if(!P)return null;
  const today=todayKey(),cap=pianoMin(P),studyToday=isStudyDay(today,P);
  /* 1. oggi, partendo da com'era stamattina */
  const t0=planTracks(P,a=>r5(attMin(a)*(1-attFrac(a,today))));
  const oggi=studyToday?planDay(t0,today,cap):[];
  for(const x of oggi){
    const now=attFrac(x.a),dm=attMin(x.a)*(now-attFrac(x.a,today));
    x.done=now>=1||dm>=x.min-2;x.doneMin=x.done?x.min:Math.max(0,Math.min(x.min,dm));
  }
  /* 2. da domani: quello che resta adesso, dando per fatto quello che oggi è ancora in programma */
  const owe={};for(const x of oggi)if(!x.done)owe[x.a.id]=(owe[x.a.id]||0)+x.min-x.doneMin;
  const tracks=planTracks(P,a=>r5(attMin(a)*(1-attFrac(a))-(owe[a.id]||0)));
  const fine={};
  for(const t of tracks)if(trackLeft(t)<=0)fine[t.b.id]=oggi.some(x=>x.t.b.id===t.b.id)?today:'fatto';
  const days=[];let k=addDays(today,1);
  const last=tracks.reduce((m,t)=>t.entro>m?t.entro:m,'');
  for(let n=0;k<=last&&n<800&&tracks.some(t=>trackLeft(t)>0);n++,k=addDays(k,1)){
    if(!isStudyDay(k,P))continue;
    const items=planDay(tracks,k,cap);
    if(items.length)days.push({k,items});
    for(const t of tracks)if(!fine[t.b.id]&&trackLeft(t)<=0)fine[t.b.id]=k;
  }
  /* 3. semaforo: ci sta tutto prima della prova? */
  const studyBetween=(a,b)=>{let n=0;for(let d=addDays(a,1);d<=b;d=addDays(d,1))if(isStudyDay(d,P))n++;return n};
  const sem=tracks.map(t=>{
    const all=arr(t.b.attivita),tot=all.reduce((s,a)=>s+attMin(a),0),done=all.reduce((s,a)=>s+attMin(a)*attFrac(a),0);
    const first=[...(oggi.length?[{k:today,items:oggi}]:[]),...days].find(d=>d.items.some(x=>x.t.b.id===t.b.id));
    const short=trackLeft(t),f=fine[t.b.id];
    let col,txt;
    if(short>0){
      const avail=Math.max(1,studyBetween(today,t.entro)),extra=Math.ceil(short/avail/5)*5;
      col='red';txt=`Non ci sta tutto prima della prova: restano fuori circa ${fmtMin(short)}. Servirebbero ${extra} minuti in più al giorno, oppure chiedi a Claude di rivedere il piano.`;
    }else if(f==='fatto'){col='ok';txt='Tutto fatto per questa prova.'}
    else{const slack=studyBetween(f,t.entro);
      col=slack>=2?'ok':'warn';
      txt=`Finisci ${f===today?'oggi':dayDate(f)}`+(slack?`, ${pl(slack,'giorno','giorni')} di studio prima della scadenza.`:', proprio alla scadenza: se salti un giorno, aggiungi qualche minuto.');}
    return {t,col,txt,tot,done,start:first?first.k:null};
  });
  return {P,cap,today,studyToday,oggi,days,sem,tracks};
}
const SEM_LBL={ok:'In linea',warn:'Poco margine',red:'Non ci sta'};
/* per un argomento dell'app: quante sezioni circa stanno nei minuti di oggi, e a che punto sei */
function secHint(x,t){const st=topicStats(t),n=Math.max(1,Math.min(st.tot,Math.round(x.min/attMin(x.a)*st.tot)));
  return (x.fine?'fino alla fine':`circa ${pl(n,'sezione','sezioni')}`)+` · ${st.read} di ${st.tot} lette`}
function planItemMeta(x,showEx){
  const t=attTopic(x.a),tot=attMin(x.a),bits=[];
  if(showEx)bits.push(esc(x.t.e.nome));
  if(t)bits.push(fmtMin(x.min),secHint(x,t));
  else bits.push(x.min<tot?`${fmtMin(x.min)} di ${fmtMin(tot)}`+(x.fine?', la finisci':''):fmtMin(x.min));
  return bits.join(' · ');
}
/* una riga del piano con la spunta: tocchi la casella per «Fatto», il testo per aprire l'argomento */
function planRow(x,showEx,today){
  const t=attTopic(x.a),ok=today?x.done:attFrac(x.a)>=1;
  return `<div class="pl-it${ok?' ok':''}">
    <button class="pl-chk" data-act="att-toggle" data-id="${esc(x.a.id)}" aria-pressed="${ok}" aria-label="${ok?'Togli la spunta':'Segna come fatto'}: ${esc(x.a.titolo)}"><span class="box-c" aria-hidden="true">${ok?'✓':''}</span></button>
    ${t?`<button class="pl-t" data-act="open-topic" data-id="${esc(t.id)}">`:'<div class="pl-t">'}<span class="t">${esc(x.a.titolo)}</span><span class="m">${planItemMeta(x,showEx)}</span>${t?'</button>':'</div>'}
  </div>`;
}
function planNowCard(st){
  const x=st.oggi.find(i=>!i.done);
  if(x){const t=attTopic(x.a),tot=attMin(x.a),fr=attFrac(x.a);
    return `<section class="card now stack-s"><div class="eyebrow">Adesso · ${esc(x.t.e.nome)}</div>
      <div class="what">${esc(x.a.titolo)}</div>
      ${x.a.cosa?md(x.a.cosa):''}
      <div class="muted small">${t?`Oggi ${fmtMin(x.min)} · ${secHint(x,t)}`:x.min<tot?`Oggi ${fmtMin(x.min)} su ${fmtMin(tot)}`+(x.fine?': la finisci':': il resto nei prossimi giorni'):fmtMin(x.min)}</div>
      ${t?`<span class="bar"><b style="width:${Math.round(fr*100)}%"></b></span>`:''}
      <div class="btnrow">${t?`<button class="btn primary big" data-act="open-topic" data-id="${esc(t.id)}">Apri</button><button class="btn ghost" data-act="att-toggle" data-id="${esc(x.a.id)}">Segna fatto</button>`
        :`<button class="btn primary big" data-act="att-toggle" data-id="${esc(x.a.id)}">Fatto</button>`}</div></section>`;
  }
  const nx=st.days[0];
  const next=nx?`<p class="muted" style="margin:0">Se vuoi andare avanti, la prossima è <b>${esc(nx.items[0].a.titolo)}</b> (${esc(nx.items[0].t.e.nome)}).</p>
    ${attTopic(nx.items[0].a)?`<button class="btn" data-act="open-topic" data-id="${esc(attTopic(nx.items[0].a).id)}">Apri</button>`
      :`<button class="btn" data-act="att-toggle" data-id="${esc(nx.items[0].a.id)}">Fatta anche questa</button>`}`:'';
  if(st.oggi.length)return `<section class="card now done-card stack-s"><div class="eyebrow">Oggi</div><div class="what">Piano di oggi fatto</div>
    <p style="margin:0">${fmtMin(st.oggi.reduce((s,i)=>s+i.min,0))} di studio. Il resto del piano si è già aggiornato.</p>${next}</section>`;
  if(!st.studyToday&&nx)return `<section class="card now stack-s"><div class="eyebrow">Oggi è un giorno libero</div>
    <div class="what">Si riprende ${esc(dayDate(nx.k))}</div>${next}</section>`;
  return `<section class="card now stack-s"><div class="eyebrow">Piano</div><div class="what">Non c'è altro in programma</div>
    <p class="muted" style="margin:0">Hai finito tutte le attività del piano. Chiedi a Claude il prossimo pezzo.</p></section>`;
}
function planSemHTML(st,full){
  return st.sem.map(s=>{const pc=s.tot?Math.round(s.done/s.tot*100):0;
    return `<div class="sem"><div class="sem-h"><b>${esc(s.t.e.nome)}</b><span class="chip ${s.col==='ok'?'ok':s.col==='warn'?'warn':'red'}">${SEM_LBL[s.col]}</span></div>
      <div class="small">${esc(s.txt)}</div>
      ${full?`<div class="muted small">${s.t.b.titolo?esc(s.t.b.titolo)+' · ':''}fatto ${pc}% (${fmtMin(s.done)} di ${fmtMin(s.tot)})${s.start&&s.start!==st.today?` · comincia ${esc(dayDate(s.start))}`:''}</div>
      <span class="bar"><b style="width:${pc}%"></b></span>`:''}</div>`}).join('')||'<div class="muted">Nessun esame del piano è in corso.</div>';
}

    <div class="btnrow"><button class="btn" data-act="plan-min">Cambia i minuti al giorno</button></div></section>

function renderEsami(){

  if(r.arg&&S.arg.has(r.arg))return renderTopic(v,S.arg.get(r.arg));
  if(r.gloss&&S.esami.has(r.gloss))return renderGloss(v,S.esami.get(r.gloss));

  if(act.length<2)S.sorting=false;

async function fillStorage(){
  const el=$('#storage');if(!el)return;
  let t='';
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();t=`Usati ${fmtBytes(e.usage||0)}.`}}catch(e){}
  try{if(navigator.storage&&navigator.storage.persisted){t+=(await navigator.storage.persisted())?' Memoria protetta: il dispositivo non la cancella da solo.':' Memoria non ancora protetta: il dispositivo potrebbe liberarla se resta senza spazio.'}}catch(e){}
  el.textContent=t||'Questo browser non dice quanto spazio usa.';
}

/* Più file insieme: prima gli esami, poi gli altri in ordine di nome (1di4, 2di4…).
   Ognuno si controlla come se i precedenti fossero già importati, così un esame e i suoi contenuti possono arrivare insieme. */
function batchCheck(files){
  const pre=files.map(f=>{let d=null;try{d=JSON.parse(cleanInput(f.text))}catch(_){}return {...f,d:obj(d)}});
  const rk=f=>f.d.tipo==='nuovo_esame'?0:1,nm=f=>String(f.d.id_pacchetto||f.name);
  pre.sort((a,b)=>rk(a)-rk(b)||nm(a).localeCompare(nm(b),'it',{numeric:true}));
  const keepE=S.esami,keepA=S.arg,out=[];
  try{
    for(const f of pre){
      const res=parsePackage(f.text);
      if(res.errs&&res.errs.length){out.push({name:f.name,errs:res.errs});continue}
      const plan=buildPlan(res.data);
      out.push({name:f.name,data:res.data,lines:plan.lines,warns:res.warns.concat(plan.warns),prev:plan.prev});
      S.esami=plan.esami;S.arg=plan.arg;
    }
  }finally{S.esami=keepE;S.arg=keepA}
  return out;
}
function batchSheet(items,remote){
  const ok=items.filter(x=>x.data),bad=items.filter(x=>!x.data),warns=dedupe([].concat(...ok.map(x=>x.warns)));
  S.checked={batch:ok.map(x=>x.data),errText:bad.map(x=>x.name+': '+x.errs.join(' ')).join('\n').replace(/<[^>]+>/g,'')};
  openSheet(`<h2>${remote?'Novità da Claude':'Anteprima'} · ${pl(items.length,'pacchetto','pacchetti')}</h2><div class="stack-s">
    ${ok.length?`<div class="msg okk batch"><div class="eyebrow">Pronti da importare: ${ok.length}</div><ul>${ok.map(x=>
      `<li><span class="ico">✓</span><span><b>${esc(x.data.id_pacchetto)}</b>${x.prev?` <span class="chip warn">${remote?'c\'era già: lo aggiorno':'già importato: lo sovrascrivo'}</span>`:''}<br><span class="small">${x.lines.join(' ')}</span></span></li>`).join('')}</ul></div>`:''}
    ${bad.length?`<div class="msg err batch"><div class="eyebrow">Non si importano: ${bad.length}</div><ul>${bad.map(x=>
      `<li><span class="ico">✗</span><span><b>${esc(x.name)}</b><br><span class="small">${x.errs[0]}</span></span></li>`).join('')}</ul></div>`:''}
    ${warns.length?`<div class="msg wrn"><div class="eyebrow">Da sapere</div><ul>${warns.slice(0,5).map(x=>`<li>${x}</li>`).join('')}${warns.length>5?`<li>…e altri ${warns.length-5}.</li>`:''}</ul></div>`:''}
    ${ok.length?'<p class="note">I tuoi progressi restano.</p>':''}
    <div class="foot"><button class="btn ghost" data-act="${remote?'close':'import'}">${remote?'Non ora':'Indietro'}</button>${bad.length?'<button class="btn" data-act="copy-err">Copia gli errori</button>':''}${ok.length?`<button class="btn primary" data-act="apply-batch">Importa ${ok.length}</button>`:''}</div></div>`);
}

/* ---------- azioni ---------- */
const ACT={
  more:b=>{S.more.add(b.dataset.k);render()},
  import:()=>{const ta=$('#imp-ta');if(ta)S.draft=ta.value;importSheet()},
  'remote-check':async b=>{b.disabled=true;await checkRemote();render();
    const n=remotePending().length;toast(S.remote.err?'Non riesco a controllare adesso':n?pl(n,'novità','novità')+' da scaricare':'Tutto aggiornato')},
  'remote-update':async b=>{
    const todo=remotePending();if(!todo.length){toast('Tutto aggiornato');return}
    const label=b.textContent;b.disabled=true;b.textContent='Scarico…';
    let files;
    try{files=await Promise.all(todo.map(async v=>{const r=await fetch(REMOTE+v.file,{cache:'no-cache'});
      if(!r.ok)throw new Error(v.file);return {name:v.file,text:await r.text()}}))}
    catch(e){b.disabled=false;b.textContent=label;toast('Non riesco a scaricare: controlla la connessione e riprova');return}
    b.disabled=false;b.textContent=label;
    batchSheet(batchCheck(files),true);
    S.remoteHash=Object.fromEntries(todo.map(v=>[v.id_pacchetto,v.hash]));/* dopo openSheet: serve ad apply-batch */
  },
  close:()=>closeSheet(),
  'pick-file':()=>{const ta=$('#imp-ta');if(ta)S.draft=ta.value;$('#file-in').value='';$('#file-in').click()},
  check:()=>{const ta=$('#imp-ta');S.draft=ta?ta.value:S.draft;previewSheet(parsePackage(S.draft))},
  'copy-err':async()=>{if(S.checked&&S.checked.errText&&await copyText('Il pacchetto non si importa:\n'+S.checked.errText))toast('Copiato')},
  apply:async b=>{
    const plan=S.checked&&S.checked.plan;if(!plan)return;b.disabled=true;
    try{await applyPlan(plan)}catch(e){toast('Non sono riuscito a salvare: '+(e&&e.message||e));b.disabled=false;return}
    S.draft='';closeSheet();toast('Importato');
    if(plan.piano){S.planPage=true;go('adesso');return}
    S.route={esame:plan.p.esame_id,arg:null};S.open=null;
    if(!S.esami.has(plan.p.esame_id))S.route={esame:null,arg:null};
    go('esami');
  },
  'apply-batch':async b=>{
    const list=S.checked&&S.checked.batch;if(!list)return;b.disabled=true;
    let n=0,last=null;
    try{for(const d of list){await applyPlan(buildPlan(d));n++;last=d.esame_id}}
    catch(e){closeSheet();toast(`Mi sono fermato dopo ${pl(n,'pacchetto','pacchetti')}: ${e&&e.message||e}`);render();return}
    S.draft='';closeSheet();toast(`Importati ${pl(n,'pacchetto','pacchetti')}`);
    if(list.some(d=>d.tipo==='piano_studio')){S.planPage=true;go('adesso');return}
    S.route={esame:S.esami.has(last)?last:null,arg:null};S.open=null;
    go('esami');
  },
  export:()=>{S.exportAll=false;exportSheet()},
  'exp-mode':b=>{S.exportAll=b.dataset.all==='1';exportSheet()},
  'copy-exp':async()=>{const ex=buildExport(S.exportAll);
    if(await copyText(ex.text,$('#exp-ta'))){await markExported();toast('Copiato: incollalo a Claude')}
    else toast('Non riesco a copiare: tieni premuto sul testo e scegli Copia')},
  'share-exp':async()=>{const ex=buildExport(S.exportAll);
    const f=new File([ex.text],'progressi-'+todayKey()+'.txt',{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:'Progressi studio'});await markExported();toast('Fatto')}catch(e){if(e&&e.name!=='AbortError')toast('Condivisione non riuscita: usa Copia')}
    }else toast('Qui non posso condividere file: usa Copia')},
  'open-exam':b=>{S.route={esame:b.dataset.id,arg:null};render();window.scrollTo(0,0)},
  'open-topic':b=>{const a=S.arg.get(b.dataset.id);if(!a)return;S.route={esame:a.esame_id,arg:a.id};S.open=null;S.tab='esami';lsSet(LS_TAB,'esami');
    setImp('ultimo',a.id);render();window.scrollTo(0,0)},
  back:()=>{if(S.route.arg)S.route.arg=null;else if(S.route.gloss)S.route.gloss=null;else S.route.esame=null;render();window.scrollTo(0,0)},
  /* collegamenti interni: si apre il riquadro di ripasso; da dentro il riquadro si va avanti e si torna «Indietro» */

    b.closest('.card').querySelectorAll('.ans-in').forEach(el=>{st.v[+el.dataset.i]=el.value});
    if(R.caselle.some((c,i)=>!String(st.v[i]==null?'':st.v[i]).trim())){toast(R.caselle.length>1?'Riempi tutte le caselle':'Scrivi la tua risposta');return}
    st.tries=(st.tries||0)+1;st.res=[];st.msg=[];
    R.caselle.forEach((c,i)=>{const [ok,m]=ansCheck(c,st.v[i]);st.res[i]=ok;st.msg[i]=m});
    if(st.res.every(Boolean)){if(!exSolSeenNow(id))await saveEx(id,'fatto',st.v);toast('Giusto!')}
    rerender()},
  'ans-pick':b=>{const id=b.dataset.id,r=refFind(id);if(!r||!r.item.risposta)return;
    const st=S.exAns[id]||(S.exAns[id]={v:[],res:null,msg:[],tries:0}),c=r.item.risposta.caselle[+b.dataset.i];
    st.v[+b.dataset.i]=arr(c&&c.opzioni)[+b.dataset.o];rerender()},
  'ans-reset':b=>{S.exAns[b.dataset.id]={v:[],res:null,msg:[],tries:0};delete S.ex[b.dataset.id];rerender()},
  'dismiss-tip':()=>{lsSet(LS_TIP,'1');$('#banner').hidden=true},
  'reload-app':()=>location.reload(),
  'edit-exam':b=>editExamSheet(b.dataset.id),
  'goto-exam':b=>{S.route={esame:b.dataset.id,arg:null};S.tab='esami';lsSet(LS_TAB,'esami');render();window.scrollTo(0,0)},
  /* piano di studio: la spunta «Fatto» di un'attività (resta sul dispositivo, come le sezioni lette) */
  'att-toggle':async b=>{const id=b.dataset.id,k='att:'+id;
    if(S.prog.has(k)){S.prog.delete(k);await del('progressi',k);toast('Spunta tolta')}
    else{const r={id:k,tipo:'attivita',rif:id,data:todayKey(),ts:Date.now()};S.prog.set(k,r);await put('progressi',r);toast('Fatto. Il piano si è aggiornato')}
    render()},
  'plan-open':()=>{S.planPage=true;S.tab='adesso';lsSet(LS_TAB,'adesso');render();window.scrollTo(0,0)},
  'plan-close':()=>{S.planPage=false;render();window.scrollTo(0,0)},
  'plan-min':()=>planMinSheet(),
  'plan-min-save':async()=>{const raw=$('#pl-min').value.trim(),n=Number(raw);
    if(!/^\d+$/.test(raw)||n<15||n>480){toast('Scrivi un numero di minuti tra 15 e 480, per esempio 90');return}
    const P=pianoS();await setImp('piano_minuti',P&&n===+P.minuti_giorno?null:n);await setImp('piano_minuti_ts',Date.now());
    closeSheet();toast('Salvato: il piano si è ricalcolato');render()},
  'plan-min-reset':async()=>{await setImp('piano_minuti',null);await setImp('piano_minuti_ts',Date.now());closeSheet();toast('Rimessi i minuti di Claude');render()},
  'req-toggle':async b=>{const k=reqKey(b.dataset.id,b.dataset.r),all={...spunte()};
    if(all[k])delete all[k];else all[k]=true;await setImp('requisiti_spunte',all);render()},
  'save-exam':async b=>{
    const id=b.dataset.id,base=S.esami.get(id);if(!base)return;
    const raw=$('#ed-ore').value.trim().replace(',','.'),data=$('#ed-data').value,ore=Number(raw),pausa=$('#ed-pausa').checked;
    if(!isDate(data)){toast('Scegli una data valida');return}
    if(!/^\d+(\.\d+)?$/.test(raw)||ore>60){toast('Le ore devono essere un numero da 0 a 60, per esempio 4 o 4,5');return}
    const v={};
    if(data!==base.data_esame)v.data_esame=data;
    if(ore!==+base.ore_settimanali)v.ore_settimanali=ore;
    if(pausa)v.pausa=true;
    await saveScelte(id,v);closeSheet();toast('Salvato');render()},
  'reset-exam':async b=>{const id=b.dataset.id,p=obj(scelte()[id]).pausa;
    await saveScelte(id,p?{pausa:true}:{});editExamSheet(id);render();toast('Rimessi i valori di Claude')},
  'sort-toggle':()=>{S.sorting=!S.sorting;render()},
  move:async b=>{
    const ids=activeExams().map(e=>e.id),i=ids.indexOf(b.dataset.id),j=i+(+b.dataset.d);
    if(i<0||j<0||j>=ids.length)return;
    [ids[i],ids[j]]=[ids[j],ids[i]];
    /* gli esami in pausa tengono il loro posto, per quando tornano attivi */
    await saveOrder(ids.concat(arr(S.imp.ordine_esami).filter(x=>!ids.includes(x))));render()}
};
document.addEventListener('click',e=>{
  const tab=e.target.closest('.nav [data-tab]');
  if(tab){const t=tab.dataset.tab;if(t==='esami'&&S.tab==='esami'){S.route={esame:null,arg:null}}if(t==='adesso')S.planPage=false;go(t);return}
  const b=e.target.closest('[data-act]');
  if(b&&ACT[b.dataset.act]){e.preventDefault();ACT[b.dataset.act](b);return}
  if(e.target.id==='backdrop')closeSheet();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#backdrop').hidden)closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='gl-q'){S.glq=e.target.value;filterGloss();return}
  /* le caselle degli esercizi: il testo si tiene in memoria, così non si perde quando la pagina si ridisegna */
  const t=e.target;if(t.classList&&t.classList.contains('ans-in')){const id=t.dataset.id,st=S.exAns[id]||(S.exAns[id]={v:[],res:null,msg:[],tries:0});st.v[+t.dataset.i]=t.value}});
document.addEventListener('keydown',e=>{const t=e.target;
  if(e.key==='Enter'&&t.classList&&t.classList.contains('ans-in')){e.preventDefault();const b=t.closest('.card').querySelector('[data-act="ans-check"]');if(b)b.click()}});
$('#file-in').addEventListener('change',async e=>{
  const fs=[...(e.target.files||[])];if(!fs.length)return;
  if(fs.length===1){
    try{S.draft=await fs[0].text()}catch(_){toast('Non riesco a leggere il file');return}
    previewSheet(parsePackage(S.draft));return;
  }
  let files;
  try{files=await Promise.all(fs.map(async f=>({name:f.name,text:await f.text()})))}catch(_){toast('Non riesco a leggere i file');return}
  batchSheet(batchCheck(files));
});

function renderBanner(){
  const b=$('#banner');
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&!isStandalone()&&lsGet(LS_TIP)!=='1'){
    b.innerHTML='<span><b>Usa l\'app dall\'icona:</b> tocca Condividi → «Aggiungi alla schermata Home». Safari e l\'icona hanno memorie separate: quello che salvi qui in Safari non si vede dall\'icona.</span><button data-act="dismiss-tip" aria-label="Chiudi avviso">OK</button>';
    b.hidden=false;
  }else b.hidden=true;
}

/* ---------- avvio ---------- */
async function start(){
  renderBanner();
  try{db=await openDB();await loadAll()}
  catch(e){$('#v-adesso').innerHTML='<div class="card"><h2>Non riesco a salvare i dati</h2><p class="muted">Questo browser non mi lascia usare la memoria (succede nelle finestre private). Apri l\'app normalmente.</p></div>';return}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const t=lsGet(LS_TAB);if(TABS.includes(t))S.tab=t;
  render();
  /* novità da Claude: all'apertura, quando torni sull'app (al massimo ogni 15 minuti) e quando torna internet */
  checkAndShow();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-S.remote.ts>15*60*1000)checkAndShow()});
  window.addEventListener('online',()=>checkAndShow());
}
/* versione nuova dell'app: il service worker nuovo prende il controllo mentre l'app è già aperta con la versione vecchia.
   Lo diciamo, con un pulsante per ricaricare (i dati sono nel database e restano). Alla prima installazione non serve. */
if('serviceWorker' in navigator){
  const hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl)return;const bn=$('#banner');
    bn.innerHTML='<span><b>C\'è una versione nuova dell\'app.</b> Tocca «Ricarica» per usarla: i tuoi dati restano.</span><button data-act="reload-app">Ricarica</button>';bn.hidden=false});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
start();
})();
</script>
